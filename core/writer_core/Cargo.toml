[package]
name = "writer_core"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
ai = []
harmony-ffi = ["once_cell"]

git-https = ["dep:git2", "git2/https", "git2/vendored-openssl"]
github-api = ["dep:reqwest"]

[dependencies]
writer_platform_api = { path = "../writer_platform_api" }
walkdir = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"
sha2 = "0.10"
tempfile = "3.8"
aho-corasick = "1.1.4"
once_cell = { version = "1.19", optional = true }
git2 = { version = "0.20.4", optional = true, default-features = false, features = ["vendored-libgit2"] }
base64 = "0.22.1"
rayon = "1.12.0"
log = "0.4"
unicode-segmentation = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[dependencies.uniffi]
version = "0.28.0"

[build-dependencies]
uniffi = { version = "0.28.0", features = ["build"] }

[dev-dependencies]
criterion = "0.5.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "aggregate_events"
harness = false

[[bench]]
name = "starmap_storage_bench"
harness = false
