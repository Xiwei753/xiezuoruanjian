[package]
name = "writer_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ai = []

[dependencies]
walkdir = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
md5 = '0.7'
tempfile = '3.8'
aho-corasick = "1.1.4"
git2 = { version = "0.20.4", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22.1"
rayon = "1.12.0"

[dependencies.uniffi]
version = "0.28.0"
features = ["cli"]

[build-dependencies]
uniffi = { version = "0.28.0", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "aggregate_events"
harness = false

[[bench]]
name = "validation_bench"
harness = false


[[bench]]
name = "chapter_bench"
harness = false
