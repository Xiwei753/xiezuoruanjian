[package]
name = "sujian-linux-qt"
version = "0.1.0"
edition = "2021"

[lib]
name = "sujian_linux_qt"
path = "src/lib.rs"

[[bin]]
name = "sujian-linux-qt"
path = "src/main.rs"
test = true
bench = false

[lints]
workspace = true

[features]
default = []
ai = ["writer_core/ai"]
## Issue #707 评论 5724685300: 测试辅助功能 — 暴露测试专用的内部入口
## （`run_on_qt_thread`、`open_data_root_for_tests`）给集成测试。
## 仅在 `cargo test --features test-helpers` 时启用，不影响生产构建。
test-helpers = []

[dependencies]
writer_core = { path = "../../core/writer_core", features = ["git-https", "github-api"] }
writer_platform_api = { path = "../../core/writer_platform_api" }
writer_diagnostics = { path = "../../core/writer_diagnostics" }
writer-platform-linux = { path = "../../platform/rust/linux" }
arboard = "3.4.1"
rfd = "0.14.1"
qmetaobject = "0.2.10"
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
uuid = "1.8"
chrono = "0.4"
cpp = "0.5.11"
log = "0.4"
bitflags = "2"

[build-dependencies]
cpp_build = "0.5.11"
pkg-config = "0.3.33"
qmetaobject = "0.2.10"
semver = "1"

[dev-dependencies]
tempfile = "3.27.0"
