style:
  active: true
  # 启用关键风格规则，禁用对现有代码噪音过大的规则。
  # 格式类规则（缩进/换行/空格等）由 .editorconfig + ktlint 负责。
  # 以下仅列出需要覆盖默认值的规则（buildUponDefaultConfig = true）。
  # 默认启用的低噪音规则（保留默认）：EqualsNullCall / ExplicitItLambdaParameter /
  # ModifierOrder / ObjectLiteralToLambda /
  # OptionalAbstractKeyword / ProtectedMemberInFinalClass /
  # RedundantHigherOrderMapUsage / UselessCallOnNotNull
  CollapsibleIfStatements:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: false    # 现有代码大量括号用于可读性（动画/位运算），整改代价大
  UntilInsteadOfRangeTo:
    active: true
  # --- 以下规则默认启用但对现有代码噪音过大，显式禁用 ---
  LoopWithTooManyJumpStatements:
    active: false    # 视觉规划器循环多跳转点，整改代价大
  DestructuringDeclarationWithTooManyEntries:
    active: false    # 现有代码有大量解构声明
  ForbiddenComment:
    active: false    # TODO/FIXME注释是合法的工作标记
  ForbiddenVoid:
    active: false    # Void在部分Java互操作中必要
  FunctionOnlyReturningConstant:
    active: false    # 常量函数在特定模式中有用
  MagicNumber:
    active: false    # UI代码大量硬编码尺寸/颜色，整改代价大
  MaxLineLength:
    active: false    # 格式由editorconfig+ktlint负责
  MayBeConst:
    active: false    # 现有代码大量非const顶层val，整改范围大
  NewLineAtEndOfFile:
    active: false    # 格式由editorconfig+ktlint负责
  NestedClassesVisibility:
    active: false    # 嵌套类可见性在现有代码中不一致
  ReturnCount:
    active: false    # 现有代码多返回点方法多
  SafeCast:
    active: false    # 安全转换模式在现有代码中广泛使用
  SerialVersionUIDInSerializableClass:
    active: false    # serialVersionUID在Android Parcelable中不适用
  ThrowsCount:
    active: false    # 现有代码多异常抛出点多
  UnnecessaryAbstractClass:
    active: false    # 抽象类在现有架构中有设计用途
  UnnecessaryApply:
    active: false    # apply在构建器模式中广泛使用
  UnnecessaryFilter:
    active: false    # filter模式在现有代码中常见
  UnnecessaryInheritance:
    active: false    # 显式继承在现有代码中有文档价值
  UnusedImports:
    active: false    # IDE可自动修复，暂不作为门禁阻断
  UnusedParameter:
    active: false    # 接口/覆写方法常有未用参数
  UnusedPrivateClass:
    active: false    # 可能存在暂时未使用的私有类
  UnusedPrivateMember:
    active: false    # 可能存在暂时未使用的私有成员
  UnusedPrivateProperty:
    active: false    # 可能存在暂时未使用的私有属性
  UseAnyOrNoneInsteadOfFind:
    active: false    # find语义在部分场景更清晰
  UseArrayLiteralsInAnnotations:
    active: false    # 现有注解格式不一致
  UseCheckNotNull:
    active: false
  UseCheckOrError:
    active: false    # 现有代码混用require/check/throw
  UseDataClass:
    active: false    # 数据类转换影响序列化兼容性
  UseIfInsteadOfWhen:
    active: false    # when表达式可读性优于if链，不强制
  UseIsNullOrEmpty:
    active: false    # 现有代码有自定义空判断逻辑
  UseOrEmpty:
    active: false
  UseRequire:
    active: false
  UseRequireNotNull:
    active: false    # 现有代码混用require/check/throw
  UtilityClassWithPublicConstructor:
    active: false    # 工具类模式在现有代码中常见
  VarCouldBeVal:
    active: false    # 现有代码大量var可改val，整改范围大
  WildcardImport:
    active: false    # 现有代码大量通配符导入
  SpacingBetweenPackageAndImports:
    active: false    # 格式由editorconfig+ktlint负责
  NoTabs:
    active: false    # 格式由editorconfig+ktlint负责
  TrailingWhitespace:
    active: false    # 格式由editorconfig+ktlint负责
  ExpressionBodySyntax:
    active: false    # 表达式体风格不强制
  DataClassContainsFunctions:
    active: false    # 数据类含函数在现有代码中常见
  RedundantVisibilityModifierRule:
    active: false    # 显式public在Android代码中有文档价值

naming:
  active: true
  # 启用关键命名规则，确保类/函数/变量命名可读。
  # 默认启用的规则（保留默认）：ClassNaming / ConstructorParameterNaming /
  # FunctionNaming / FunctionParameterNaming / ObjectPropertyNaming /
  # PackageNaming / TopLevelPropertyNaming / VariableNaming
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
    ignoreAnnotated:
      - 'Composable'
  # --- 以下规则默认启用但对现有代码噪音过大，显式禁用 ---
  EnumNaming:
    active: false          # 现有枚举可能有非标准命名
  InvalidPackageDeclaration:
    active: false          # 文件路径与包声明可能不一致
  MatchingDeclarationName:
    active: false          # 文件名与类名可能不一致（多类文件）
  MemberNameEqualsClassName:
    active: false          # 构造函数参数与类同名是常见模式
  NoNameShadowing:
    active: false          # 内外层同名变量是常见Kotlin模式
  NonBooleanPropertyPrefixedWithIs:
    active: false          # Android惯用is前缀非布尔属性
  BooleanPropertyNaming:
    active: false          # 布尔属性命名模式在现有代码中不一致
  LambdaParameterNaming:
    active: false          # Lambda参数命名在现有代码中不一致
  ForbiddenClassName:
    active: false          # 类名限制对现有代码过于严格
  FunctionMaxLength:
    active: false
  FunctionMinLength:
    active: false
  VariableMaxLength:
    active: false
  VariableMinLength:
    active: false

# 禁用非核心规则集（现有代码未全量整改，逐个启用是独立后续任务）。
comments:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
performance:
  active: false
potential-bugs:
  active: false
