# Detekt 配置 — 跨平台写作软件 Android 端
#
# buildUponDefaultConfig = true：在 detekt 默认配置之上覆盖以下规则。
#
# 启用的规则集：
# - complexity: 复杂度红线（认知复杂度、圈复杂度、方法长度、类大小等）
# - style: 代码风格关键规则（不必要的抽象/let/括号、潜在bug模式等）
# - naming: 命名规范（变量、函数、类命名）
#
# 禁用的规则集（现有代码未全量整改，逐个启用是独立后续任务）：
# - comments / empty-blocks / exceptions / performance / potential-bugs
#
# 格式由 .editorconfig + IDE/ktlint 负责，不需要 detekt-formatting plugin。
# 兼容 Detekt 1.23.8 + Kotlin 2.0.21。
#
# 排除原则（Issue #597）：
# - SujianNavigationSuite/PhonePortraitShell/StarMapRoute/EditorViewModel/
#   EditorSessionCoordinator/StarMapCanvas/StarMapScreen/SettingsRoute/
#   SujianApp/WritingPane 不做整文件排除，必须被规则实际检查。
# - 其他超标文件保留精确例外，每条附原因注释，排除列表不无限制增长。
# - 优先调整阈值或重构代码，而非增加排除。

