[package]
name = "sujian-proof"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Offline Chinese proofreading engine for Sujian"

[lints]
workspace = true

[dependencies]
aho-corasick = "1.1.4"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
