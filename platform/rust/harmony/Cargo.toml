[package]
name = "writer-platform-harmony"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["github-api"]
github-api = ["writer_core/github-api", "dep:reqwest"]

[dependencies]
writer_core = { path = "../../../core/writer_core", features = ["harmony-ffi"] }
writer_platform_api = { path = "../../../core/writer_platform_api" }
writer_diagnostics = { path = "../../../core/writer_diagnostics" }
uuid = { version = "1.8", features = ["v4"] }
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"], optional = true }
