[package]
name = "writer-platform-android"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["github-api"]
ai = ["writer_uniffi/ai"]
github-api = ["writer_uniffi/github-api", "dep:reqwest"]
git-https = ["writer_uniffi/git-https"]

[dependencies]
writer_core = { path = "../../../core/writer_core" }
writer_platform_api = { path = "../../../core/writer_platform_api" }
writer_uniffi = { path = "../../../core/writer_uniffi", features = ["github-api"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"], optional = true }
