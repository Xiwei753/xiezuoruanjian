[patch.crates-io]
# #1033：libgit2 1.9.4 的 OpenSSL 封装把 SSL_ERROR_NONE/ZERO_RETURN 等
# 合并成 "SSL error: unknown error"，Rust 侧无法恢复真实失败阶段。
# 这里使用仓库内同一版本 libgit2-sys，仅修补 streams/openssl.c 的错误分类。
libgit2-sys = { path = "third_party/libgit2-sys" }

[workspace]
members = [
    "core/writer_core",
    "core/writer_diagnostics",
    "core/writer_platform_api",
    "core/writer_uniffi",
    "crates/sujian-proof",
    "platform/rust/linux",
    "platform/rust/android",
    "platform/rust/harmony",
    "apps/Linux_qt",
    "apps/sujian_mcp",
]
resolver = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
non_send_fields_in_send_ty = "warn"
unwrap_used = { level = "warn", priority = 1 }
expect_used = { level = "warn", priority = 1 }
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
excessive_nesting = "warn"
many_single_char_names = "warn"
