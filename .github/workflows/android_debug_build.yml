name: Sujian Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [no-ai, ai]
        abi: [arm64-v8a, x86_64]
        include:
          - flavor: no-ai
            abi: universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read NDK version
        id: ndk
        run: |
          source tools/android/ndk.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk_version_numeric=$NDK_VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo-ndk binary
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flavor }}-${{ matrix.abi }}
          shared-key: android
          cache-on-failure: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndk.outputs.ndk_version }}

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build scripts executable
        run: chmod +x tools/build_android.sh tools/android/build_native.sh tools/android/verify_apk_abis.sh

      - name: Test Rust core
        if: matrix.abi == 'arm64-v8a'
        run: cargo test -p writer_core ${{ matrix.flavor == 'ai' && '--features ai' || '' }}

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are incomplete. Refusing to build with runner debug signing."
            exit 1
          fi
          echo "Decoding Android keystore from secret..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Keystore decode failed: output file is empty or missing. Check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore decoded successfully."

      - name: Build Android ${{ matrix.flavor }} Debug APK (${{ matrix.abi }})
        env:
          WRITER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          WRITER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WRITER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WRITER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          ./tools/build_android.sh --${{ matrix.flavor }} --abi ${{ matrix.abi }}

      - name: Test Android ${{ matrix.flavor }} Debug unit tests
        if: matrix.abi == 'arm64-v8a'
        working-directory: apps/android
        run: ./gradlew test${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugUnitTest

      - name: Verify APK ABI
        run: |
          FLAVOR_DIR="${{ matrix.flavor == 'no-ai' && 'noAi' || 'ai' }}"
          APK_PATH=$(ls apps/android/app/build/outputs/apk/$FLAVOR_DIR/debug/sujian-android-*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "::error::ABI verification aborted: renamed APK not found in apps/android/app/build/outputs/apk/$FLAVOR_DIR/debug/"
            exit 1
          fi
          ./tools/android/verify_apk_abis.sh "$APK_PATH" "${{ matrix.abi }}"

      - name: Upload ${{ matrix.flavor }} ${{ matrix.abi }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sujian-android-${{ matrix.flavor }}-${{ matrix.abi }}-debug
          path: apps/android/app/build/outputs/apk/${{ matrix.flavor == 'no-ai' && 'noAi' || 'ai' }}/debug/sujian-android-*.apk

      - name: Upload native build artifacts for emulator test
        if: matrix.flavor == 'no-ai' && matrix.abi == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: native-no-ai-x86_64
          path: |
            apps/android/app/build/generated/writer-native/
            apps/android/app/build/generated/writer-uniffi/
          retention-days: 1

  emulator-test:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        flavor: [no-ai]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read NDK version
        id: ndk
        run: |
          source tools/android/ndk.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk_version_numeric=$NDK_VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-no-ai-x86_64
          path: apps/android/app/build/generated/

      - name: Verify native artifacts
        run: |
          SO_PATH="apps/android/app/build/generated/writer-native/noAiDebug/x86_64/libuniffi_writer_core.so"
          if [ ! -f "$SO_PATH" ]; then
            echo "::error::Native library artifact missing: $SO_PATH"
            exit 1
          fi
          UNIFFI_DIR="apps/android/app/build/generated/writer-uniffi/noAi/kotlin/uniffi"
          if [ ! -d "$UNIFFI_DIR" ]; then
            echo "::error::UniFFI bindings artifact missing: $UNIFFI_DIR"
            exit 1
          fi
          echo "Native artifacts verified successfully."

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndk.outputs.ndk_version }}

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build scripts executable
        run: chmod +x tools/build_android.sh tools/android/build_native.sh tools/android/verify_apk_abis.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abi
            # Deterministic input: the instrumented tests drive a real InputMethodService
            # (deterministic test IME inside the androidTest APK, see
            # apps/android/app/src/androidTest/java/com/xiwei/sujian/test/testime and
            # kotlin/com/xiwei/sujian/testime). It is
            # passive and only acts on explicit startService commands, so no recorrection
            # or updateSelection interference can corrupt the editor. Install app + test
            # APKs first, wait until the test IME is registered (cold boot), then enable
            # it and set it as the only default IME; other system IMEs stay enabled but
            # are never bound. Note: android-emulator-runner executes each script line as
            # its own sh -c, so loops/multi-statement logic must stay on one line.
            # The connected run below skips the install tasks (-x :app:install*): updating
            # the test APK while it is registered as an input method makes
            # InputMethodManagerService clear the IME's enabled/default state ("Input
            # method reinstalling, clearing additional subtypes"), reverting
            # default_input_method to LatinIME and failing every IME-binding test.
            cd apps/android && ANDROID_NDK_HOME=$ANDROID_NDK_ROOT ./gradlew :app:install${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}Debug :app:install${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugAndroidTest -x build${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugWriterNative -Psujian.android.abis=x86_64
            TEST_IME="com.xiwei.sujian.test/.testime.TestInputMethodService"; IME_FOUND=""; for i in $(seq 1 15); do IME_FOUND=$(adb shell ime list -s 2>/dev/null | tr -d '\r' | grep -F "$TEST_IME" || true); [ -n "$IME_FOUND" ] && break; sleep 2; done; echo "Test IME registered: [$IME_FOUND]"; [ -n "$IME_FOUND" ] || { echo "::error::Test IME not registered after install: $TEST_IME"; exit 1; }
            adb shell ime enable com.xiwei.sujian.test/.testime.TestInputMethodService
            adb shell ime set com.xiwei.sujian.test/.testime.TestInputMethodService
            echo "default_input_method: [$(adb shell settings get secure default_input_method 2>/dev/null | tr -d '\r')]"
            adb logcat -G 16M 2>/dev/null || true
            adb logcat -c 2>/dev/null || true
            ( adb logcat -v threadtime > "$RUNNER_TEMP/sujian-editor-logcat.log" 2>&1 & ) || true
            cd apps/android && ANDROID_NDK_HOME=$ANDROID_NDK_ROOT ./gradlew connected${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugAndroidTest -x :app:install${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}Debug -x :app:install${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugAndroidTest -x build${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugWriterNative -Psujian.android.abis=x86_64 || ( echo '===== FAILED TEST XMLS ====='; find app/build/outputs/androidTest-results -name '*.xml' -exec grep -l -e '<failure' -e '<error' {} \; -exec cat {} \; 2>/dev/null; echo '===== APP LOGCAT (file) ====='; grep -E 'SujianEditorInput|SujianTestIme|SujianApp|AnimatedTextEditorCoordinator|TestRunner' "$RUNNER_TEMP/sujian-editor-logcat.log" 2>/dev/null | tail -n 600; exit 1 )
