name: Sujian Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [no-ai, ai]
        abi: [arm64-v8a, x86_64]
        include:
          - flavor: no-ai
            abi: universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read NDK version
        id: ndk
        run: |
          source tools/android/ndk.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk_version_numeric=$NDK_VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flavor }}-${{ matrix.abi }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndk.outputs.ndk_version }}

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build scripts executable
        run: chmod +x tools/build_android.sh tools/android/build_native.sh tools/android/verify_apk_abis.sh

      - name: Test Rust core
        run: cargo test -p writer_core ${{ matrix.flavor == 'ai' && '--features ai' || '' }}

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are incomplete. Refusing to build with runner debug signing."
            exit 1
          fi
          echo "Decoding Android keystore from secret..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Keystore decode failed: output file is empty or missing. Check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore decoded successfully."

      - name: Build Android ${{ matrix.flavor }} Debug APK (${{ matrix.abi }})
        env:
          WRITER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          WRITER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WRITER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WRITER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          ./tools/build_android.sh --${{ matrix.flavor }} --abi ${{ matrix.abi }}

      - name: Test Android ${{ matrix.flavor }} Debug unit tests
        if: matrix.abi != 'universal'
        working-directory: apps/android
        run: ./gradlew test${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugUnitTest

      - name: Verify APK ABI
        run: |
          FLAVOR_DIR="${{ matrix.flavor == 'no-ai' && 'noAi' || 'ai' }}"
          APK_PATH=$(ls apps/android/app/build/outputs/apk/$FLAVOR_DIR/debug/sujian-android-*.apk 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Warning: APK not found for ABI verification"
          else
            ./tools/android/verify_apk_abis.sh "$APK_PATH" "${{ matrix.abi }}"
          fi

      - name: Upload ${{ matrix.flavor }} ${{ matrix.abi }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sujian-android-${{ matrix.flavor }}-${{ matrix.abi }}-debug
          path: apps/android/app/build/outputs/apk/${{ matrix.flavor == 'no-ai' && 'noAi' || 'ai' }}/debug/sujian-android-*.apk

  emulator-test:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        flavor: [no-ai]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read NDK version
        id: ndk
        run: |
          source tools/android/ndk.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk_version_numeric=$NDK_VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flavor }}-x86_64-emulator

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndk.outputs.ndk_version }}

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build scripts executable
        run: chmod +x tools/build_android.sh tools/android/build_native.sh tools/android/verify_apk_abis.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abi
            cd apps/android
            ANDROID_NDK_HOME=$ANDROID_NDK_ROOT ./gradlew connected${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugAndroidTest -Psujian.android.abis=x86_64
