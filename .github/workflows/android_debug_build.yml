name: Sujian Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  build:
    name: Build APK (${{ matrix.flavor }} / arm64-v8a)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [no-ai, ai]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read NDK version
        id: ndk
        run: |
          source tools/android/ndk.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk_version_numeric=$NDK_VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo-ndk binary
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flavor }}-arm64-v8a
          shared-key: android
          cache-on-failure: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndk.outputs.ndk_version }}

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build scripts executable
        run: chmod +x tools/build_android.sh tools/android/build_native.sh tools/android/verify_apk_abis.sh

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are incomplete. Refusing to build with runner debug signing."
            exit 1
          fi
          echo "Decoding Android keystore from secret..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Keystore decode failed: output file is empty or missing. Check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore decoded successfully."

      - name: Build Android ${{ matrix.flavor }} Debug APK (arm64-v8a)
        env:
          WRITER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          WRITER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WRITER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WRITER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          ./tools/build_android.sh --${{ matrix.flavor }} --abi arm64-v8a

      - name: Upload ${{ matrix.flavor }} arm64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sujian-android-${{ matrix.flavor }}-arm64-v8a-debug
          path: apps/android/app/build/outputs/apk/${{ matrix.flavor == 'no-ai' && 'noAi' || 'ai' }}/debug/sujian-android-*.apk

      - name: Upload ${{ matrix.flavor }} UniFFI bindings
        uses: actions/upload-artifact@v4
        with:
          name: android-uniffi-${{ matrix.flavor }}
          path: apps/android/app/build/generated/writer-uniffi/${{ matrix.flavor == 'no-ai' && 'noAi' || 'ai' }}/
          retention-days: 1

  # === Rust Core common tests (no AI feature) ===
  core-common-test:
    name: Core 通用测试
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-test
          cache-on-failure: true

      - name: Core 通用测试（功能回归 / Rust 安全与类型问题）
        run: cargo test -p writer_core

  # === Rust Core AI-specific tests ===
  core-ai-test:
    name: Core AI 专项测试
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ai-test
          cache-on-failure: true

      - name: Core AI 专项测试（AI feature gate / AI 服务契约）
        run: cargo test -p writer_core --features ai --test ai_feature

  # === Android common unit tests (noAi, reusing pre-generated UniFFI bindings) ===
  android-unit-test:
    name: Android 通用单元测试
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Download no-ai UniFFI bindings
        uses: actions/download-artifact@v4
        with:
          name: android-uniffi-no-ai
          path: apps/android/app/build/generated/writer-uniffi/noAi/

      - name: Verify UniFFI bindings
        run: |
          UNIFFI_DIR="apps/android/app/build/generated/writer-uniffi/noAi/kotlin/uniffi"
          if [ ! -d "$UNIFFI_DIR" ]; then
            echo "::error::UniFFI bindings artifact missing: $UNIFFI_DIR"
            exit 1
          fi
          echo "UniFFI bindings verified successfully."

      - name: Android 通用单元测试（Android 平台错误）
        working-directory: apps/android
        run: ./gradlew testNoAiDebugUnitTest -x buildNoAiDebugWriterNative -x generateNoAiDebugWriterUniffi

  # === Android AI-specific unit tests (ai, reusing pre-generated AI UniFFI bindings) ===
  android-ai-test:
    name: Android AI 专项单元测试
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Download ai UniFFI bindings
        uses: actions/download-artifact@v4
        with:
          name: android-uniffi-ai
          path: apps/android/app/build/generated/writer-uniffi/ai/

      - name: Verify AI UniFFI bindings
        run: |
          UNIFFI_DIR="apps/android/app/build/generated/writer-uniffi/ai/kotlin/uniffi"
          if [ ! -d "$UNIFFI_DIR" ]; then
            echo "::error::AI UniFFI bindings artifact missing: $UNIFFI_DIR"
            exit 1
          fi
          echo "AI UniFFI bindings verified successfully."

      - name: Android AI 专项测试（AI 专项错误）
        working-directory: apps/android
        run: ./gradlew testAiDebugUnitTest -x buildAiDebugWriterNative -x generateAiDebugWriterUniffi
