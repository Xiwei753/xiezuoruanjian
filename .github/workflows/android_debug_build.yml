name: Android Native Debug Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build script executable
        run: chmod +x tools/build_android.sh

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/keystore.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 secret is missing. Failing the workflow to prevent unsigned releases."
            exit 1
          fi

      - name: Build Android Native Debug APK
        env:
          WRITER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          WRITER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WRITER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WRITER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          ./tools/build_android.sh

      - name: Verify APK Signature
        run: |
          # Use build-tools from Android SDK
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools/ | sort -n | tail -1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner
          $APKSIGNER verify --print-certs apps/android/app/build/outputs/apk/debug/app-debug.apk | grep "Signer #1 certificate SHA-256 digest:"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: writer-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
