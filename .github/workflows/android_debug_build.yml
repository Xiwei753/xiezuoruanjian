name: Android Debug Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: |
          cd apps/flutter_legacy
          flutter pub get

      - name: Analyze code
        run: |
          cd apps/flutter_legacy
          flutter analyze

      - name: Run tests
        run: |
          cd apps/flutter_legacy
          flutter test

      - name: Build Android Debug APK
        run: |
          cd apps/flutter_legacy
          flutter build apk --debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: writer-app-debug-apk
          path: apps/flutter_legacy/build/app/outputs/flutter-apk/app-debug.apk
