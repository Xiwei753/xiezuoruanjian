name: Sujian Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [no-ai, ai]
        abi: [arm64-v8a, x86_64]
        include:
          - flavor: no-ai
            abi: universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read NDK version
        id: ndk
        run: |
          source tools/android/ndk.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk_version_numeric=$NDK_VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo-ndk binary
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flavor }}-${{ matrix.abi }}
          shared-key: android
          cache-on-failure: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndk.outputs.ndk_version }}

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build scripts executable
        run: chmod +x tools/build_android.sh tools/android/build_native.sh tools/android/verify_apk_abis.sh

      - name: Test Rust core
        if: matrix.abi == 'arm64-v8a'
        run: cargo test -p writer_core ${{ matrix.flavor == 'ai' && '--features ai' || '' }}

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are incomplete. Refusing to build with runner debug signing."
            exit 1
          fi
          echo "Decoding Android keystore from secret..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Keystore decode failed: output file is empty or missing. Check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore decoded successfully."

      - name: Build Android ${{ matrix.flavor }} Debug APK (${{ matrix.abi }})
        env:
          WRITER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          WRITER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WRITER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WRITER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          ./tools/build_android.sh --${{ matrix.flavor }} --abi ${{ matrix.abi }}

      - name: Test Android ${{ matrix.flavor }} Debug unit tests
        if: matrix.abi == 'arm64-v8a'
        working-directory: apps/android
        run: ./gradlew test${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugUnitTest

      - name: Verify APK ABI
        run: |
          FLAVOR_DIR="${{ matrix.flavor == 'no-ai' && 'noAi' || 'ai' }}"
          APK_PATH=$(ls apps/android/app/build/outputs/apk/$FLAVOR_DIR/debug/sujian-android-*.apk 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Warning: APK not found for ABI verification"
          else
            ./tools/android/verify_apk_abis.sh "$APK_PATH" "${{ matrix.abi }}"
          fi

      - name: Upload ${{ matrix.flavor }} ${{ matrix.abi }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sujian-android-${{ matrix.flavor }}-${{ matrix.abi }}-debug
          path: apps/android/app/build/outputs/apk/${{ matrix.flavor == 'no-ai' && 'noAi' || 'ai' }}/debug/sujian-android-*.apk

      - name: Upload native build artifacts for emulator test
        if: matrix.flavor == 'no-ai' && matrix.abi == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: native-no-ai-x86_64
          path: |
            apps/android/app/build/generated/writer-native/
            apps/android/app/build/generated/writer-uniffi/
          retention-days: 1

  emulator-test:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        flavor: [no-ai]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read NDK version
        id: ndk
        run: |
          source tools/android/ndk.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk_version_numeric=$NDK_VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-no-ai-x86_64
          path: apps/android/app/build/generated/

      - name: Verify native artifacts
        run: |
          SO_PATH="apps/android/app/build/generated/writer-native/noAiDebug/x86_64/libuniffi_writer_core.so"
          if [ ! -f "$SO_PATH" ]; then
            echo "::error::Native library artifact missing: $SO_PATH"
            exit 1
          fi
          UNIFFI_DIR="apps/android/app/build/generated/writer-uniffi/noAi/kotlin/uniffi"
          if [ ! -d "$UNIFFI_DIR" ]; then
            echo "::error::UniFFI bindings artifact missing: $UNIFFI_DIR"
            exit 1
          fi
          echo "Native artifacts verified successfully."

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndk.outputs.ndk_version }}

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build scripts executable
        run: chmod +x tools/build_android.sh tools/android/build_native.sh tools/android/verify_apk_abis.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abi
            # Deterministic input: the instrumented tests drive the editor's InputConnection
            # directly. A bound IME on the emulator would otherwise mirror text changes
            # back as recorrection setComposingRegion calls (LatinIME's onUpdateSelection
            # path), marking the editor as composing and corrupting subsequent plain
            # commits. Wait for the IME service to register (cold boot), then disable
            # every IME and verify none remains enabled.
            for i in $(seq 1 15); do
              IME_IDS=$(adb shell ime list -s 2>/dev/null | tr -d '\r')
              [ -n "$IME_IDS" ] && break
              sleep 2
            done
            echo "IME list before disable: [$IME_IDS]"
            for ime in $IME_IDS; do adb shell ime disable "$ime" || true; done
            adb shell settings put secure enabled_input_methods "" || true
            adb shell settings put secure default_input_method "" || true
            STILL_ENABLED=$(adb shell ime list -s -a 2>/dev/null | tr -d '\r' | grep -E '\(enabled\)' | sed 's/ .*//' || true)
            if [ -n "$STILL_ENABLED" ]; then
              echo "WARNING: ime disable did not take effect for [$STILL_ENABLED]; forcing package disable"
              for ime in $STILL_ENABLED; do
                pkg=${ime%%/*}
                adb shell pm disable-user --user 0 "$pkg" || true
              done
            fi
            echo "Enabled IMEs after disable: [$(adb shell ime list -s -a 2>/dev/null | tr -d '\r' | grep -E '\(enabled\)' | sed 's/ .*//' || true)]"
            adb logcat -G 16M 2>/dev/null || true
            adb logcat -c 2>/dev/null || true
            ( adb logcat -v threadtime > "$RUNNER_TEMP/sujian-editor-logcat.log" 2>&1 & ) || true
            cd apps/android && ANDROID_NDK_HOME=$ANDROID_NDK_ROOT ./gradlew connected${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugAndroidTest -x build${{ matrix.flavor == 'no-ai' && 'NoAi' || 'Ai' }}DebugWriterNative -Psujian.android.abis=x86_64 || ( echo '===== FAILED TEST XMLS ====='; find app/build/outputs/androidTest-results -name '*.xml' -exec grep -l -e '<failure' -e '<error' {} \; -exec cat {} \; 2>/dev/null; echo '===== APP LOGCAT (file) ====='; grep -E 'SujianEditorInput|SujianApp|AnimatedTextEditorCoordinator|TestRunner' "$RUNNER_TEMP/sujian-editor-logcat.log" 2>/dev/null | tail -n 600; exit 1 )
