name: Android Native Debug Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android, aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Make build script executable
        run: chmod +x tools/build_android.sh

      - name: Build Android Native Debug APK
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          ./tools/build_android.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-native-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
