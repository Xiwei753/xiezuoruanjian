name: Sync to Gitee

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    name: Mirror to Gitee
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN is missing"
            exit 1
          fi
          HEADER="> **本仓库是 [源仓库](https://github.com/Xiwei753/xiezuoruanjian) 的镜像备份。**\n>\n> 反馈、议题、拉取等操作请前往源仓库。这里也会看，但是不建议在这里。\n"
          { echo -e "$HEADER"; cat README.md; } > README.tmp && mv README.tmp README.md
          echo -e "\n---\n更多赞助方式请见[源仓库](https://github.com/Xiwei753/xiezuoruanjian)" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "添加镜像说明" || true
          git remote add gitee https://wei-xi753:${GITEE_TOKEN}@gitee.com/wei-xi753/xiezuoruanjian.git || true
          git push gitee main --force
