name: Sync to Gitee

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sync-to-gitee
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror current snapshot to Gitee
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Clean untracked/ignored files from working tree
        run: git clean -fdx

      - name: Remove sensitive and large-file patterns
        run: |
          rm -f .github-token .gitee-token .env* secrets.json api_keys.json
          rm -rf target/ build/ dist/ node_modules/ .gradle/ .dart_tool/
          rm -rf apps/android/app/build/ apps/android/build/ apps/Linux_qt/build/
          rm -rf apps/harmony/oh_modules/ apps/harmony/.hvigor/
          rm -f *.apk *.aab *.so *.hap *.exe *.msi *.AppImage *.zip *.7z *.dmg *.dll
          rm -rf writer_app_workspace/ workspace/ backups/ trash/ sqlite_cache/ logs/ tmp/
          rm -f *.db *.sqlite *.sqlite3 *.jks *.keystore *.p12 *.pem *.p7b *.cer

      - name: Validate Gitee token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "## Gitee 同步未执行" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "缺少仓库 Actions secret：**GITEE_TOKEN**。" >> "$GITHUB_STEP_SUMMARY"
            echo "请在 Settings → Secrets and variables → Actions 中重新配置有效的 Gitee 私人令牌。" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Gitee sync aborted: GITEE_TOKEN is missing"
            exit 1
          fi
          echo "::add-mask::${GITEE_TOKEN}"

      - name: Build orphan snapshot and push to Gitee
        env:
          GITEE_USERNAME: wei-xi753
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REMOTE_URL: https://gitee.com/wei-xi753/xiezuoruanjian.git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan gitee-snapshot
          git rm -r --cached . >/dev/null 2>&1 || true

          HEADER="> **本仓库是 [源仓库](https://github.com/Xiwei753/xiezuoruanjian) 当前源码快照的镜像备份。**\n>\n> Gitee 镜像不保留 GitHub 历史、tags 或构建产物；反馈、议题、拉取等操作请前往源仓库。这里也会看，但是不建议在这里。\n"
          FOOTER="\n---\n更多赞助方式请见[源仓库](https://github.com/Xiwei753/xiezuoruanjian)"
          { echo -e "$HEADER"; cat README.md; } > README.tmp
          mv README.tmp README.md
          echo -e "$FOOTER" >> README.md

          git add -A

          SNAPSHOT_SIZE=$(git ls-files -z | xargs -0 du -ch 2>/dev/null | tail -1 | cut -f1)
          echo "Snapshot size: ${SNAPSHOT_SIZE}"
          SNAPSHOT_MB=$(du -sm --exclude=.git . 2>/dev/null | cut -f1)
          if [ "${SNAPSHOT_MB:-0}" -gt 500 ]; then
            echo "::error::Snapshot exceeds 500 MB (${SNAPSHOT_MB} MB)."
            exit 1
          fi

          git commit -m "同步 GitHub 当前源码快照"

          ASKPASS_DIR="${RUNNER_TEMP}/gitee-auth"
          ASKPASS_SCRIPT="${ASKPASS_DIR}/askpass.sh"
          mkdir -p "$ASKPASS_DIR"
          cat > "$ASKPASS_SCRIPT" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS_SCRIPT"
          trap 'rm -rf "$ASKPASS_DIR"' EXIT
          export GIT_ASKPASS="$ASKPASS_SCRIPT"
          export GIT_TERMINAL_PROMPT=0

          git remote remove gitee >/dev/null 2>&1 || true
          git remote add gitee "$GITEE_REMOTE_URL"

          if ! git push gitee HEAD:main --force; then
            echo "## Gitee 同步失败" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "远端地址：\`${GITEE_REMOTE_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "请确认 GITEE_TOKEN 尚未过期，并具有目标仓库的写入权限。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## Gitee 同步成功" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "已将 GitHub main 的当前源码快照强制更新到 Gitee main。" >> "$GITHUB_STEP_SUMMARY"
