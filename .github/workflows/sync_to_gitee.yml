name: Sync to Gitee

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Mirror current snapshot to Gitee
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Clean untracked/ignored files from working tree
        run: git clean -fdx

      - name: Remove sensitive and large-file patterns
        run: |
          rm -f .github-token .gitee-token .env* secrets.json api_keys.json
          rm -rf target/ build/ dist/ node_modules/ .gradle/ .dart_tool/
          rm -rf apps/android/app/build/ apps/android/build/ apps/Linux_qt/build/
          rm -rf apps/harmony/oh_modules/ apps/harmony/.hvigor/
          rm -f *.apk *.aab *.so *.hap *.exe *.msi *.AppImage *.zip *.7z *.dmg *.dll
          rm -rf writer_app_workspace/ workspace/ backups/ trash/ sqlite_cache/ logs/ tmp/
          rm -f *.db *.sqlite *.sqlite3 *.jks *.keystore *.p12 *.pem *.p7b *.cer

      - name: Validate Gitee credentials
        id: validate_gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          MISSING=""
          GITEE_USERNAME_RESOLVED="${GITEE_USERNAME:-${{ github.repository_owner }}}"
          GITEE_REPO_RESOLVED="${GITEE_REPO:-${{ github.event.repository.name }}}"
          if [ -z "${GITEE_TOKEN:-}" ]; then
            MISSING="GITEE_TOKEN"
          fi
          if [ -n "$MISSING" ]; then
            echo "## ⚠️ Gitee 同步未执行" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "缺少必需的 secret(s): **${MISSING}**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "请在仓库 Settings → Secrets and variables → Actions 中配置以上 secret。" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Gitee sync aborted: missing required secret(s): ${MISSING}"
            exit 1
          fi
          echo "gitee_username=${GITEE_USERNAME_RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "gitee_repo=${GITEE_REPO_RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Gitee credentials validated: username=${GITEE_USERNAME_RESOLVED}, repo=${GITEE_REPO_RESOLVED}"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build orphan snapshot and push to Gitee
        if: steps.validate_gitee.outputs.skip != 'true'
        env:
          GITEE_USERNAME: ${{ steps.validate_gitee.outputs.gitee_username }}
          GITEE_REPO: ${{ steps.validate_gitee.outputs.gitee_repo }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan gitee-snapshot
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -A

          HEADER="> **本仓库是 [源仓库](https://github.com/Xiwei753/xiezuoruanjian) 当前源码快照的镜像备份。**\n>\n> Gitee 镜像不保留 GitHub 历史、tags 或构建产物；反馈、议题、拉取等操作请前往源仓库。这里也会看，但是不建议在这里。\n"
          FOOTER="\n---\n更多赞助方式请见[源仓库](https://github.com/Xiwei753/xiezuoruanjian)"

          { echo -e "$HEADER"; cat README.md; } > README.tmp && mv README.tmp README.md
          echo -e "$FOOTER" >> README.md

          SNAPSHOT_SIZE=$(git ls-files -z | xargs -0 du -ch 2>/dev/null | tail -1 | cut -f1)
          echo "Snapshot size: ${SNAPSHOT_SIZE}"
          SNAPSHOT_MB=$(du -sm . 2>/dev/null | cut -f1)
          if [ "${SNAPSHOT_MB:-0}" -gt 500 ]; then
            echo "ERROR: Snapshot exceeds 500 MB (${SNAPSHOT_MB} MB). Aborting push to prevent Gitee quota overflow."
            exit 1
          fi

          git add -A
          git commit -m "同步 GitHub 当前源码快照"

          ENCODED_TOKEN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${GITEE_TOKEN}', safe=''))")
          GITEE_REMOTE="https://${GITEE_USERNAME}:${ENCODED_TOKEN}@gitee.com/${GITEE_REPO}.git"

          echo "Verifying Gitee remote access..."
          if ! git ls-remote "${GITEE_REMOTE}" HEAD >/dev/null 2>&1; then
            echo "::error::Failed to access Gitee repository. Possible causes:"
            echo "  1. GITEE_TOKEN lacks 'projects' read permission"
            echo "  2. GITEE_REPO path is incorrect (current: ${GITEE_REPO})"
            echo "  3. GITEE_USERNAME does not match the token owner (current: ${GITEE_USERNAME})"
            echo "  4. The repository does not exist on Gitee"
            echo "  5. Token contains special characters that were not properly URL-encoded"
            exit 1
          fi
          echo "Gitee remote access verified."

          git remote add gitee "${GITEE_REMOTE}" || true
          git push gitee HEAD:main --force
