name: Windows ONNX Runtime asset digest
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows_onnx_asset_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    steps:
      - name: Download and fingerprint official ONNX Runtime v1.22.0 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip"
          $archive = Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-1.22.0.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 3
          $size = (Get-Item $archive).Length
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ORT_ARCHIVE_SIZE=$size"
          Write-Host "ORT_ARCHIVE_SHA256=$digest"
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $zip.Entries | Where-Object { $_.FullName -like '*onnxruntime.dll' -or $_.FullName -like '*onnxruntime_providers_shared.dll' } | ForEach-Object { Write-Host "ORT_ARCHIVE_ENTRY=$($_.FullName)" }
          } finally { $zip.Dispose() }
