name: Sujian Static Analysis & Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  static-checks:
    name: Lint & Security Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-analysis
          cache-on-failure: true

      - name: Configure UTF-8 environment
        run: |
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"

      # === Rust quality checks ===
      - name: Rust fmt 检查（格式或命名）
        run: cargo fmt --all --check

      - name: Rust all-features Clippy（代码复杂度 / Rust 安全与类型问题）
        run: cargo clippy --package writer_core --all-targets --all-features -- -D warnings

      - name: Clippy on sujian-linux-qt（Rust 安全与类型问题）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qt6-base-dev qt6-declarative-dev qt6-tools-dev libgl-dev
          cargo clippy --package sujian-linux-qt --all-targets -- -D warnings

      # === Android quality checks ===
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Detekt 代码质量检查（代码复杂度 / 文件类过大 / 跨层依赖）
        working-directory: apps/android
        run: ./gradlew detekt

      - name: Kotlin 格式检查 ktlint（代码格式）
        working-directory: apps/android
        run: ./gradlew ktlintCheck

      # === Android NDK + cargo-ndk for lintNoAiDebug ===
      # lintNoAiDebug 经 preBuild → generateNoAiDebugWriterUniffi → buildNoAiDebugWriterNative
      # 传递依赖 tools/android/build_native.sh，需要 cargo-ndk + Rust targets + ANDROID_NDK_HOME。
      # 复用 android_debug_build.yml 的工具链安装模式（固定 CARGO_NDK_VERSION + 缓存）。
      - name: Read NDK version
        id: ndk
        run: |
          source tools/android/ndk.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndk.outputs.ndk_version }}

      - name: Cache cargo-ndk binary
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Make native build scripts executable
        run: chmod +x tools/android/build_native.sh

      - name: Android Lint noAiDebug（Android 平台错误）
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: ./gradlew lintNoAiDebug

      # === Source structure gate ===
      - name: 源码结构自测
        run: python3 tools/test_check_source_structure.py

      - name: 源码结构门禁（文件/类过大 / 代码复杂度）
        run: python3 tools/check_source_structure.py

      # === Android architecture gate (plain source scan, #597 六/七) ===
      # 架构规则是普通源码扫描，不再伪装成 Android 单元测试。
      # NDK/cargo-ndk 仅因 lintNoAiDebug 传递依赖 buildNoAiDebugWriterNative 而安装，
      # 架构检查本身不依赖 native 产物。
      - name: Android architecture checker tests
        run: python3 tools/test_check_android_architecture.py

      - name: Android architecture check
        run: python3 tools/check_android_architecture.py

      # === Security / i18n / docs / token checks (preserved) ===
      - name: Check no binary artifacts in tracked files
        run: bash tools/check_no_binary_artifacts.sh

      - name: Check documentation links
        run: python3 tools/check_doc_links.py

      - name: Test Rust safety pattern checker
        run: python3 tools/test_check_rust_safety_patterns.py

      - name: Run Rust safety pattern scan on repository
        run: python3 tools/check_rust_safety_patterns.py .

      - name: Security audit Rust dependencies
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi
          cargo audit

      - name: Check UI tokens
        run: bash scripts/check_ui_tokens.sh

      - name: Check QML DesignTokens (dt) passing
        run: python3 tools/check_qml_dt.py

      - name: Check Android i18n (no Chinese in Kotlin)
        run: python3 tools/check_android_i18n.py

      - name: Check i18n completeness
        run: python3 tools/check_i18n.py

      - name: Run i18n check script tests
        run: python3 tools/test_check_i18n.py

      - name: Check HarmonyOS native bridge consistency
        run: python3 tools/check_harmony_native_bridge.py

      - name: Android workflow contract tests
        run: python3 tools/test_android_workflow_contracts.py
