name: Linux Build

on:
  push:
    branches:
      - main
    paths:
      - 'apps/linux/**'
      - 'core/writer_core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/linux/**'
      - 'core/writer_core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  build-no-ai:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            libqt5svg5-dev \
            qml-module-qtquick2 \
            qml-module-qtquick-controls2 \
            qml-module-qtquick-layouts \
            qml-module-qtquick-window2 \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Build Linux no-ai
        run: cargo build -p linux --release

      - name: Rename artifact
        run: cp target/release/linux target/release/writer-linux-no-ai

      - name: Upload no-ai artifact
        uses: actions/upload-artifact@v4
        with:
          name: writer-linux-no-ai
          path: target/release/writer-linux-no-ai
          retention-days: 30

  build-ai:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            libqt5svg5-dev \
            qml-module-qtquick2 \
            qml-module-qtquick-controls2 \
            qml-module-qtquick-layouts \
            qml-module-qtquick-window2 \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Build Linux ai
        run: cargo build -p linux --release --features ai

      - name: Rename artifact
        run: cp target/release/linux target/release/writer-linux-ai

      - name: Upload ai artifact
        uses: actions/upload-artifact@v4
        with:
          name: writer-linux-ai
          path: target/release/writer-linux-ai
          retention-days: 30
