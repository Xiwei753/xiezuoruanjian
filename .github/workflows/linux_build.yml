name: Linux Build

on:
  push:
    branches:
      - main
    paths:
      - 'apps/linux/**'
      - 'core/writer_core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/linux/**'
      - 'core/writer_core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  build-no-ai:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Configure Qt environment variables
        run: |
          QMAKE_PATH="$(command -v qmake6 || command -v qmake-qt6)"
          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
          echo "QT_INCLUDE_PATH=$($QMAKE_PATH -query QT_INSTALL_HEADERS)" >> "$GITHUB_ENV"
          echo "QT_LIBRARY_PATH=$($QMAKE_PATH -query QT_INSTALL_LIBS)" >> "$GITHUB_ENV"
          echo "QT_VERSION_MAJOR=6" >> "$GITHUB_ENV"

      - name: Test writer core
        run: cargo test -p writer_core

      - name: Security audit Rust dependencies
        run: cargo install cargo-audit --locked && cargo audit

      - name: Test Linux contracts
        run: cargo test -p linux

      - name: Build Linux no-ai
        run: cargo build -p linux --release

      - name: Rename artifact
        run: cp target/release/linux target/release/writer-linux-no-ai

      - name: Upload no-ai artifact
        uses: actions/upload-artifact@v4
        with:
          name: writer-linux-no-ai
          path: target/release/writer-linux-no-ai
          retention-days: 30

  build-ai:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Configure Qt environment variables
        run: |
          QMAKE_PATH="$(command -v qmake6 || command -v qmake-qt6)"
          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
          echo "QT_INCLUDE_PATH=$($QMAKE_PATH -query QT_INSTALL_HEADERS)" >> "$GITHUB_ENV"
          echo "QT_LIBRARY_PATH=$($QMAKE_PATH -query QT_INSTALL_LIBS)" >> "$GITHUB_ENV"
          echo "QT_VERSION_MAJOR=6" >> "$GITHUB_ENV"

      - name: Test writer core
        run: cargo test -p writer_core --features ai

      - name: Test Linux contracts
        run: cargo test -p linux --features ai

      - name: Build Linux ai
        run: cargo build -p linux --release --features ai

      - name: Rename artifact
        run: cp target/release/linux target/release/writer-linux-ai

      - name: Upload ai artifact
        uses: actions/upload-artifact@v4
        with:
          name: writer-linux-ai
          path: target/release/writer-linux-ai
          retention-days: 30
