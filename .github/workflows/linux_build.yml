name: Sujian Desktop Build

on:
  push:
    branches:
      - main
    paths:
      - 'apps/linux/**'
      - 'core/writer_core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/linux/**'
      - 'core/writer_core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  linux-appimage:
    name: Linux AppImage (${{ matrix.flavor }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: no-ai
            features: ''
          - flavor: ai
            features: '--features ai'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Qt, AppImage, and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            file \
            wget
          wget -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -O linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Configure Qt environment variables
        run: |
          QMAKE_PATH="$(command -v qmake6 || command -v qmake-qt6)"
          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"
          echo "QT_INCLUDE_PATH=$($QMAKE_PATH -query QT_INSTALL_HEADERS)" >> "$GITHUB_ENV"
          echo "QT_LIBRARY_PATH=$($QMAKE_PATH -query QT_INSTALL_LIBS)" >> "$GITHUB_ENV"
          echo "QT_VERSION_MAJOR=6" >> "$GITHUB_ENV"

      - name: Test Rust core
        run: cargo test -p writer_core ${{ matrix.features }}

      - name: Security audit Rust dependencies
        if: matrix.flavor == 'no-ai'
        run: cargo install cargo-audit --locked && cargo audit

      - name: Test Linux contracts
        run: cargo test -p sujian-linux ${{ matrix.features }}

      - name: Build Linux desktop
        run: cargo build -p sujian-linux --release ${{ matrix.features }}

      - name: Package AppImage
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/sujian-linux AppDir/usr/bin/sujian-linux
          cat > AppDir/usr/share/applications/sujian-linux.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=素笺写作
          Exec=sujian-linux
          Icon=sujian-linux
          Categories=Office;TextEditor;
          Terminal=false
          EOF
          cat > AppDir/usr/share/icons/hicolor/scalable/apps/sujian-linux.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="28" fill="#2f5d50"/>
            <path d="M34 34h60v60H34z" fill="#f5efe0"/>
            <path d="M48 50h32M48 64h32M48 78h22" stroke="#2f5d50" stroke-width="7" stroke-linecap="round"/>
          </svg>
          EOF
          OUTPUT="sujian-linux-${{ matrix.flavor }}.AppImage" \
            QML_SOURCES_PATHS="$PWD/apps/linux/qml" \
            ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --executable AppDir/usr/bin/sujian-linux \
              --desktop-file AppDir/usr/share/applications/sujian-linux.desktop \
              --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/sujian-linux.svg \
              --plugin qt \
              --output appimage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: sujian-linux-${{ matrix.flavor }}
          path: sujian-linux-${{ matrix.flavor }}.AppImage
          retention-days: 30

  windows-exe:
    name: Windows exe (${{ matrix.flavor }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: no-ai
            features: ''
          - flavor: ai
            features: '--features ai'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtdeclarative qttools'

      - name: Configure Qt environment variables
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake.exe).Source
          "QMAKE=$qmake" >> $env:GITHUB_ENV
          "QT_VERSION_MAJOR=6" >> $env:GITHUB_ENV

      - name: Test Rust core
        run: cargo test -p writer_core ${{ matrix.features }}

      - name: Test Windows desktop contracts
        run: cargo test -p sujian-linux ${{ matrix.features }}

      - name: Build Windows desktop
        run: cargo build -p sujian-linux --release ${{ matrix.features }}

      - name: Rename Windows exe
        shell: pwsh
        run: Copy-Item target/release/sujian-linux.exe target/release/sujian-windows-${{ matrix.flavor }}.exe

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: sujian-windows-${{ matrix.flavor }}
          path: target/release/sujian-windows-${{ matrix.flavor }}.exe
          retention-days: 30
