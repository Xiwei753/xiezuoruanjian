name: Sujian Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'core/writer_core/**'
      - '.github/workflows/linux_build.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  linux-appimage:
    name: Linux AppImage (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: no-ai
            features: ''
          - flavor: ai
            features: '--features ai'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Qt 6.8.3
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools qtimageformats qtwaylandcompositor'

      - name: Install system dependencies (non-Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            extra-cmake-modules \
            ninja-build \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libfuse2 \
            file \
            wget \
            xauth \
            xvfb \
            libwayland-dev \
            wayland-protocols \
            libgl-dev \
            libegl-dev
          wget -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage
          wget -O linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20240109-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Configure Qt environment variables
        run: |
          echo "QMAKE=$QT_ROOT_DIR/bin/qmake" >> "$GITHUB_ENV"
          echo "QT_VERSION_MAJOR=6" >> "$GITHUB_ENV"
          echo "QT_INCLUDE_PATH=$QT_ROOT_DIR/include" >> "$GITHUB_ENV"
          echo "QT_LIBRARY_PATH=$QT_ROOT_DIR/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$QT_ROOT_DIR/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Build fcitx5 Qt6 input context
        run: |
          wget -O fcitx5-qt-5.0.10.tar.gz https://github.com/fcitx/fcitx5-qt/archive/refs/tags/5.0.10.tar.gz
          tar -xzf fcitx5-qt-5.0.10.tar.gz
          cmake -S fcitx5-qt-5.0.10 -B fcitx5-qt-build -G Ninja \
            -DENABLE_QT4=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=ON \
            -DBUILD_ONLY_PLUGIN=ON \
            -DBUILD_STATIC_PLUGIN=OFF \
            -DWITH_FCITX_PLUGIN_NAME=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build fcitx5-qt-build --target fcitx5platforminputcontextplugin-qt6
          FCITX_QT_PLUGIN="$(find "$PWD/fcitx5-qt-build" -path '*/platforminputcontext/libfcitx5platforminputcontextplugin.so' -print -quit)"
          if [ ! -f "$FCITX_QT_PLUGIN" ]; then
            echo "::error title=fcitx5 Qt6 input context build failed::Built plugin was not found"
            exit 1
          fi
          echo "FCITX_QT_PLUGIN=$FCITX_QT_PLUGIN" >> "$GITHUB_ENV"

      - name: Check Harmony bridge consistency
        run: bash scripts/check_harmony_bridge_consistency.sh

      - name: Check QML DesignTokens dt injection
        run: python3 tools/check_qml_dt.py

      - name: Test Rust core
        run: cargo test -p writer_core ${{ matrix.features }}

      - name: Test Linux contracts
        run: cargo test -p sujian-desktop ${{ matrix.features }}

      - name: Build Linux desktop
        run: cargo build -p sujian-desktop --release ${{ matrix.features }}

      - name: Package AppImage
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/sujian-desktop AppDir/usr/bin/sujian-desktop
          cat > AppDir/usr/share/applications/sujian-desktop.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=素笺写作
          Exec=sujian-desktop
          Icon=sujian-desktop
          Categories=Office;TextEditor;
          Terminal=false
          EOF
          cp apps/desktop/resources/icons/sujian.svg AppDir/usr/share/icons/hicolor/scalable/apps/sujian-desktop.svg
          if [ ! -f "$FCITX_QT_PLUGIN" ]; then
            echo "::error title=fcitx5 Qt6 input context missing::Expected built plugin at $FCITX_QT_PLUGIN"
            exit 1
          fi
          mkdir -p AppDir/usr/plugins/platforminputcontexts
          cp -v "$FCITX_QT_PLUGIN" AppDir/usr/plugins/platforminputcontexts/
          mkdir -p AppDir/usr/plugins/platforms
          cp -v "$QT_ROOT_DIR"/plugins/platforms/libqwayland*.so AppDir/usr/plugins/platforms/
          # Ensure Wayland platform plugins are available for linuxdeploy to pick up
          # linuxdeploy-plugin-qt should auto-detect these from the Qt installation
          echo "Qt plugin path: $QT_ROOT_DIR/plugins"
          ls -la "$QT_ROOT_DIR/plugins/platforms/" || true
          ls -la "$QT_ROOT_DIR/plugins/wayland/" || true
          ls -la "$QT_ROOT_DIR/plugins/shellintegration/" || true
          OUTPUT="sujian-desktop-${{ matrix.flavor }}.AppImage" \
            QML_SOURCES_PATHS="$PWD/apps/desktop/qml" \
            EXTRA_QT_PLUGINS="platforminputcontexts/libfcitx5platforminputcontextplugin.so" \
            ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --executable AppDir/usr/bin/sujian-desktop \
              --desktop-file AppDir/usr/share/applications/sujian-desktop.desktop \
              --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/sujian-desktop.svg \
              --plugin qt \
              --output appimage
          if [ ! -f AppDir/usr/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so ]; then
            echo "::error title=AppImage fcitx5 plugin missing::Qt platform input context plugin was not packaged"
            exit 1
          fi
          # Verify critical platform plugins are packaged
          echo "=== AppDir platform plugins ==="
          find AppDir -name "libqxcb.so" -o -name "libqwayland*.so" -o -name "libfcitx5*.so" | head -20
          # ── Fail-fast: critical plugins must exist ──
          # Missing libqxcb.so: X11/XWayland will not work
          if ! find AppDir -name "libqxcb.so" | grep -q .; then
            echo "::error title=AppImage missing XCB platform plugin::libqxcb.so not found in AppDir — X11/XWayland will not work"
            exit 1
          fi
          # Missing fcitx5 platform input context: fcitx5 IME will not work
          if ! find AppDir -name "libfcitx5platforminputcontextplugin.so" | grep -q .; then
            echo "::error title=AppImage missing fcitx5 input context plugin::libfcitx5platforminputcontextplugin.so not found in AppDir — fcitx5 IME will not work"
            exit 1
          fi
          # Missing Wayland plugins: Fedora KDE Wayland is a supported platform, so this is hard fail
          if ! find AppDir -name "libqwayland*.so" | grep -q .; then
            echo "::error title=AppImage missing Wayland platform plugins::libqwayland*.so not found in AppDir — Fedora KDE Wayland will not work"
            exit 1
          fi

      - name: Smoke test AppImage startup
        run: |
          set +e
          # Set reasonable IM module fallback: wayland > fcitx > ibus
          # Do NOT hard-override user's existing QT_IM_MODULE
          export QT_IM_MODULES="wayland;fcitx;ibus"
          xvfb-run -a timeout 10s ./sujian-desktop-${{ matrix.flavor }}.AppImage > appimage-smoke.log 2>&1
          status=$?
          set -e
          cat appimage-smoke.log
          failure_patterns='QML load failed|module ".*" is not installed|Could not find the Qt platform plugin'
          if grep -E "$failure_patterns" appimage-smoke.log; then
            summary="$(grep -E "$failure_patterns" appimage-smoke.log | tr '\n' ' ' | cut -c1-800)"
            echo "::error title=AppImage smoke test failed::$summary"
            exit 1
          fi
          # Check IME diagnostics are present in log
          if grep -q "sujian.*install_event_filter" appimage-smoke.log; then
            echo "IME diagnostics found in startup log"
          else
            echo "::error title=IME diagnostics missing::install_event_filter log line not found in startup output — IME may not be initialized"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            summary="$(tr '\n' ' ' < appimage-smoke.log | cut -c1-800)"
            echo "::error title=AppImage exited unexpectedly::status $status; $summary"
            exit "$status"
          fi

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: sujian-desktop-${{ matrix.flavor }}
          path: sujian-desktop-${{ matrix.flavor }}.AppImage
          retention-days: 30
