name: HarmonyOS Test Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: harmony-test-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish HarmonyOS test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGC_AUTH_MODE: service_account
      AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
      AGC_TEST_GROUP_ID: ${{ secrets.AGC_TEST_GROUP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check required secrets
        id: secrets
        shell: bash
        env:
          AGC_SA_CREDENTIALS_B64: ${{ secrets.AGC_SA_CREDENTIALS_B64 }}
          HARMONY_SIGN_P12_B64: ${{ secrets.HARMONY_SIGN_P12_B64 }}
          HARMONY_SIGN_CER_B64: ${{ secrets.HARMONY_SIGN_CER_B64 }}
          HARMONY_SIGN_PROFILE_B64: ${{ secrets.HARMONY_SIGN_PROFILE_B64 }}
          HARMONY_SIGN_STORE_PASSWORD: ${{ secrets.HARMONY_SIGN_STORE_PASSWORD }}
          HARMONY_SIGN_KEY_ALIAS: ${{ secrets.HARMONY_SIGN_KEY_ALIAS }}
          HARMONY_SIGN_KEY_PASSWORD: ${{ secrets.HARMONY_SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            AGC_SA_CREDENTIALS_B64
            HARMONY_SIGN_P12_B64
            HARMONY_SIGN_CER_B64
            HARMONY_SIGN_PROFILE_B64
            HARMONY_SIGN_STORE_PASSWORD
            HARMONY_SIGN_KEY_ALIAS
            HARMONY_SIGN_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::warning::HarmonyOS test publish skipped; missing Actions secrets: %s\n' "${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run publisher helper tests
        run: python3 tools/test_publish_harmony_test.py

      - name: Prepare AGC service-account credentials
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          AGC_SA_CREDENTIALS_B64: ${{ secrets.AGC_SA_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          umask 077
          agc_dir="$RUNNER_TEMP/sujian-agc"
          mkdir -p "$agc_dir"
          credentials_path="$agc_dir/service-account.json"
          printf '%s' "$AGC_SA_CREDENTIALS_B64" | base64 --decode > "$credentials_path"
          chmod 600 "$credentials_path"

          python3 - "$credentials_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          credential = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = ("key_id", "private_key", "sub_account", "token_uri")
          valid = all(
              isinstance(credential.get(key), str) and credential[key].strip()
              for key in required
          )
          if not valid:
              raise SystemExit("AGC service-account credential is incomplete")
          PY

          printf 'AGC_SA_CREDENTIALS=%s\n' "$credentials_path" >> "$GITHUB_ENV"

      - name: Prepare HarmonyOS release signing
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          HARMONY_SIGN_P12_B64: ${{ secrets.HARMONY_SIGN_P12_B64 }}
          HARMONY_SIGN_CER_B64: ${{ secrets.HARMONY_SIGN_CER_B64 }}
          HARMONY_SIGN_PROFILE_B64: ${{ secrets.HARMONY_SIGN_PROFILE_B64 }}
          HARMONY_SIGN_STORE_PASSWORD: ${{ secrets.HARMONY_SIGN_STORE_PASSWORD }}
          HARMONY_SIGN_KEY_ALIAS: ${{ secrets.HARMONY_SIGN_KEY_ALIAS }}
          HARMONY_SIGN_KEY_PASSWORD: ${{ secrets.HARMONY_SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          sign_dir="$RUNNER_TEMP/sujian-harmony-signing"
          mkdir -p "$sign_dir"

          printf '%s' "$HARMONY_SIGN_P12_B64" | base64 --decode > "$sign_dir/release.p12"
          printf '%s' "$HARMONY_SIGN_CER_B64" | base64 --decode > "$sign_dir/release.cer"
          printf '%s' "$HARMONY_SIGN_PROFILE_B64" | base64 --decode > "$sign_dir/release.p7b"

          python3 - "$sign_dir" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sign_dir = Path(sys.argv[1]).resolve()
          profile_path = Path("apps/harmony/build-profile.json5")
          text = profile_path.read_text(encoding="utf-8")

          values = {
              "storeFile": str(sign_dir / "release.p12"),
              "storePassword": os.environ["HARMONY_SIGN_STORE_PASSWORD"],
              "keyAlias": os.environ["HARMONY_SIGN_KEY_ALIAS"],
              "keyPassword": os.environ["HARMONY_SIGN_KEY_PASSWORD"],
              "profile": str(sign_dir / "release.p7b"),
              "certpath": str(sign_dir / "release.cer"),
          }

          for key, value in values.items():
              pattern = rf"(\b{re.escape(key)}\s*:\s*)(['\"])(.*?)\2"
              replacement = rf"\1{json.dumps(value, ensure_ascii=False)}"
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"cannot patch signing field: {key}")

          profile_path.write_text(text, encoding="utf-8")
          PY

      - name: Install HarmonyOS CLI and AGC publisher
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source tools/setup_harmony_cli.sh

          echo "HARMONY_CLI_HOME=$HARMONY_CLI_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME" >> "$GITHUB_ENV"
          echo "$HARMONY_CLI_HOME/tool/node/bin" >> "$GITHUB_PATH"
          echo "$HARMONY_CLI_HOME/bin" >> "$GITHUB_PATH"

          # The AGC publisher is a standalone bundled Node.js script.  Do not
          # install it through a desktop coding-agent integration: GitHub
          # runners do not need OpenCode/Claude/Codex just to publish an app.
          cli_js="$RUNNER_TEMP/connect-api-cli.js"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/IsKenKenYa/skills/ff4b6750dbc4b3a50d46253ca28b02398a03746b/skills/harmonyos/launch-and-distribute/hmos-connect-api-cli-skill/scripts/connect-api-cli.js" \
            --output "$cli_js"
          chmod 700 "$cli_js"
          node "$cli_js" --version
          echo "CONNECT_API_CLI_JS=$cli_js" >> "$GITHUB_ENV"

      - name: Install HarmonyOS project dependencies
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/harmony
        shell: bash
        run: ohpm install

      - name: Ensure Rust toolchain
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Publish latest main to AGC invitation testing
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: ./tools/publish_harmony_test.sh
