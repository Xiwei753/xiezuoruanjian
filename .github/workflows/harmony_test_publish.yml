name: HarmonyOS Test Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: harmony-test-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish HarmonyOS test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets
        shell: bash
        env:
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_SA_CREDENTIALS_B64: ${{ secrets.AGC_SA_CREDENTIALS_B64 }}
          HARMONY_SIGN_P12_B64: ${{ secrets.HARMONY_SIGN_P12_B64 }}
          HARMONY_SIGN_CER_B64: ${{ secrets.HARMONY_SIGN_CER_B64 }}
          HARMONY_SIGN_PROFILE_B64: ${{ secrets.HARMONY_SIGN_PROFILE_B64 }}
          HARMONY_SIGN_STORE_PASSWORD: ${{ secrets.HARMONY_SIGN_STORE_PASSWORD }}
          HARMONY_SIGN_KEY_ALIAS: ${{ secrets.HARMONY_SIGN_KEY_ALIAS }}
          HARMONY_SIGN_KEY_PASSWORD: ${{ secrets.HARMONY_SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            AGC_APP_ID
            AGC_SA_CREDENTIALS_B64
            HARMONY_SIGN_P12_B64
            HARMONY_SIGN_CER_B64
            HARMONY_SIGN_PROFILE_B64
            HARMONY_SIGN_STORE_PASSWORD
            HARMONY_SIGN_KEY_ALIAS
            HARMONY_SIGN_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::warning::HarmonyOS test publish skipped; missing Actions secrets: %s\n' "${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare AGC service account
        id: agc_credentials
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          AGC_SA_CREDENTIALS_B64: ${{ secrets.AGC_SA_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          umask 077
          agc_dir="$RUNNER_TEMP/sujian-agc"
          mkdir -p "$agc_dir"
          credentials_path="$agc_dir/service-account.json"
          printf '%s' "$AGC_SA_CREDENTIALS_B64" | base64 --decode > "$credentials_path"

          python3 - "$credentials_path" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          credentials_path = Path(sys.argv[1])
          github_output = Path(sys.argv[2])
          credential = json.loads(credentials_path.read_text(encoding="utf-8"))
          required = ("key_id", "private_key", "sub_account", "token_uri")
          if not all(isinstance(credential.get(k), str) and credential[k].strip() for k in required):
              raise SystemExit("AGC service-account credential is incomplete")

          compact = json.dumps(credential, ensure_ascii=False, separators=(",", ":"))
          print(f"::add-mask::{compact}")
          with github_output.open("a", encoding="utf-8") as handle:
              handle.write(f"json={compact}\n")
          PY

      - name: Prepare HarmonyOS release signing
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          HARMONY_SIGN_P12_B64: ${{ secrets.HARMONY_SIGN_P12_B64 }}
          HARMONY_SIGN_CER_B64: ${{ secrets.HARMONY_SIGN_CER_B64 }}
          HARMONY_SIGN_PROFILE_B64: ${{ secrets.HARMONY_SIGN_PROFILE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          sign_dir="$RUNNER_TEMP/sujian-harmony-signing"
          mkdir -p "$sign_dir"

          printf '%s' "$HARMONY_SIGN_P12_B64" | base64 --decode > "$sign_dir/release.p12"
          printf '%s' "$HARMONY_SIGN_CER_B64" | base64 --decode > "$sign_dir/release.cer"
          printf '%s' "$HARMONY_SIGN_PROFILE_B64" | base64 --decode > "$sign_dir/release.p7b"
          chmod 600 "$sign_dir/release.p12" "$sign_dir/release.cer" "$sign_dir/release.p7b"

          echo "HARMONY_SIGN_P12_FILE=$sign_dir/release.p12" >> "$GITHUB_ENV"
          echo "HARMONY_SIGN_CER_FILE=$sign_dir/release.cer" >> "$GITHUB_ENV"
          echo "HARMONY_SIGN_PROFILE_FILE=$sign_dir/release.p7b" >> "$GITHUB_ENV"

      - name: Install HarmonyOS CLI
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source tools/setup_harmony_cli.sh
          echo "HARMONY_CLI_HOME=$HARMONY_CLI_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME" >> "$GITHUB_ENV"
          echo "$HARMONY_CLI_HOME/tool/node/bin" >> "$GITHUB_PATH"
          echo "$HARMONY_CLI_HOME/bin" >> "$GITHUB_PATH"

      - name: Install HarmonyOS project dependencies
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/harmony
        shell: bash
        run: ohpm install

      - name: Ensure Rust toolchain
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build and sign HarmonyOS APP
        if: steps.secrets.outputs.ready == 'true'
        id: build
        shell: bash
        env:
          HARMONY_SIGN_STORE_PASSWORD: ${{ secrets.HARMONY_SIGN_STORE_PASSWORD }}
          HARMONY_SIGN_KEY_ALIAS: ${{ secrets.HARMONY_SIGN_KEY_ALIAS }}
          HARMONY_SIGN_KEY_PASSWORD: ${{ secrets.HARMONY_SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          from tools.publish_harmony_test import build_release_app

          app_path = build_release_app(False).resolve()
          if not app_path.is_file():
              raise SystemExit(f"Signed APP not found: {app_path}")

          with Path(sys.argv[1]).open("a", encoding="utf-8") as handle:
              handle.write(f"app_path={app_path}\n")
          print(f"Signed APP: {app_path}")
          PY

      - name: Deploy to AGC invitation testing
        if: steps.secrets.outputs.ready == 'true'
        id: agc
        uses: Eilgnaw/deploy-to-agc-testing@e3ea3b6b1c30864f4e4f8fbeb3e6322580ee9330
        with:
          service-account-json: ${{ steps.agc_credentials.outputs.json }}
          app-id: ${{ secrets.AGC_APP_ID }}
          app-path: ${{ steps.build.outputs.app_path }}
          language: zh-Hans
          test-desc: 素笺自动测试版
          release-type: "6"
          test-type: "3"
          test-group-name: "Sujian CI"
          generate-invite-code: "false"

      - name: Print AGC result
        if: steps.secrets.outputs.ready == 'true' && success()
        shell: bash
        run: |
          echo "Version ID: ${{ steps.agc.outputs.version-id }}"
          echo "Package ID: ${{ steps.agc.outputs.pkg-version }}"
          echo "Group ID: ${{ steps.agc.outputs.group-id }}"
