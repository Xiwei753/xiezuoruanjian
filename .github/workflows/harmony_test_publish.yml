name: HarmonyOS Test Publish

on:
  push:
    branches:
      - main
    paths:
      - 'apps/harmony/**'
      - 'platform/rust/harmony/**'
      - 'core/writer_core/**'
      - 'core/writer_platform_api/**'
      - 'core/writer_diagnostics/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/build_harmony.sh'
      - 'tools/setup_harmony_cli.sh'
      - 'tools/publish_harmony_test.py'
      - '.github/workflows/harmony_test_publish.yml'
  workflow_dispatch:

concurrency:
  group: harmony-test-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish HarmonyOS test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets
        shell: bash
        env:
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_SA_CREDENTIALS_B64: ${{ secrets.AGC_SA_CREDENTIALS_B64 }}
          HARMONY_SIGN_P12_B64: ${{ secrets.HARMONY_SIGN_P12_B64 }}
          HARMONY_SIGN_CER_B64: ${{ secrets.HARMONY_SIGN_CER_B64 }}
          HARMONY_SIGN_PROFILE_B64: ${{ secrets.HARMONY_SIGN_PROFILE_B64 }}
          HARMONY_SIGN_STORE_PASSWORD: ${{ secrets.HARMONY_SIGN_STORE_PASSWORD }}
          HARMONY_SIGN_KEY_ALIAS: ${{ secrets.HARMONY_SIGN_KEY_ALIAS }}
          HARMONY_SIGN_KEY_PASSWORD: ${{ secrets.HARMONY_SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            AGC_APP_ID
            AGC_SA_CREDENTIALS_B64
            HARMONY_SIGN_P12_B64
            HARMONY_SIGN_CER_B64
            HARMONY_SIGN_PROFILE_B64
            HARMONY_SIGN_STORE_PASSWORD
            HARMONY_SIGN_KEY_ALIAS
            HARMONY_SIGN_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::warning::HarmonyOS test publish skipped; missing Actions secrets: %s\n' "${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare AGC service account
        id: agc_credentials
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          AGC_SA_CREDENTIALS_B64: ${{ secrets.AGC_SA_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          umask 077
          agc_dir="$RUNNER_TEMP/sujian-agc"
          mkdir -p "$agc_dir"
          credentials_path="$agc_dir/service-account.json"
          printf '%s' "$AGC_SA_CREDENTIALS_B64" | base64 --decode > "$credentials_path"

          python3 - "$credentials_path" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          credentials_path = Path(sys.argv[1])
          github_output = Path(sys.argv[2])
          credential = json.loads(credentials_path.read_text(encoding="utf-8"))
          required = ("key_id", "private_key", "sub_account", "token_uri")
          if not all(isinstance(credential.get(k), str) and credential[k].strip() for k in required):
              raise SystemExit("AGC service-account credential is incomplete")

          compact = json.dumps(credential, ensure_ascii=False, separators=(",", ":"))
          print(f"::add-mask::{compact}")
          with github_output.open("a", encoding="utf-8") as handle:
              handle.write(f"json={compact}\n")
          PY

      - name: Prepare HarmonyOS release signing
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          HARMONY_SIGN_P12_B64: ${{ secrets.HARMONY_SIGN_P12_B64 }}
          HARMONY_SIGN_CER_B64: ${{ secrets.HARMONY_SIGN_CER_B64 }}
          HARMONY_SIGN_PROFILE_B64: ${{ secrets.HARMONY_SIGN_PROFILE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          sign_dir="$RUNNER_TEMP/sujian-harmony-signing"
          mkdir -p "$sign_dir"

          printf '%s' "$HARMONY_SIGN_P12_B64" | base64 --decode > "$sign_dir/release.p12"
          printf '%s' "$HARMONY_SIGN_CER_B64" | base64 --decode > "$sign_dir/release.cer"
          printf '%s' "$HARMONY_SIGN_PROFILE_B64" | base64 --decode > "$sign_dir/release.p7b"
          chmod 600 "$sign_dir/release.p12" "$sign_dir/release.cer" "$sign_dir/release.p7b"

          echo "HARMONY_SIGN_P12_FILE=$sign_dir/release.p12" >> "$GITHUB_ENV"
          echo "HARMONY_SIGN_CER_FILE=$sign_dir/release.cer" >> "$GITHUB_ENV"
          echo "HARMONY_SIGN_PROFILE_FILE=$sign_dir/release.p7b" >> "$GITHUB_ENV"

      - name: Install HarmonyOS CLI
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source tools/setup_harmony_cli.sh
          echo "HARMONY_CLI_HOME=$HARMONY_CLI_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME" >> "$GITHUB_ENV"
          echo "$HARMONY_CLI_HOME/tool/node/bin" >> "$GITHUB_PATH"
          echo "$HARMONY_CLI_HOME/bin" >> "$GITHUB_PATH"

      - name: Ensure AGC HarmonyOS app metadata
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_AUTH_MODE: service_account
          AGC_SA_CREDENTIALS: ${{ runner.temp }}/sujian-agc/service-account.json
        run: |
          set -euo pipefail

          skills_root="$RUNNER_TEMP/harmonyos-agent-skills"
          rm -rf "$skills_root"
          git clone --depth 1             https://gitcode.com/HarmonyOS_Skills/harmonyos-agent-skills.git             "$skills_root"

          cli_js="$(find "$skills_root"             -path '*/hmos-connect-api-cli-skill/scripts/connect-api-cli.js'             -type f -print -quit)"
          if [ -z "$cli_js" ]; then
            echo "Official HarmonyOS Agent Skills checkout does not contain connect-api-cli.js" >&2
            exit 1
          fi

          body_path="$RUNNER_TEMP/sujian-agc/app-info.json"
          cat > "$body_path" <<'JSON'
          {
            "publishCountry": "CN",
            "privacyPolicy": "https://github.com/Xiwei753/xiezuoruanjian/blob/main/PRIVACY.md",
            "privacyRightsUrl": "https://github.com/Xiwei753/xiezuoruanjian/blob/main/PRIVACY.md",
            "encrypted": 0,
            "harmonyChildType": 10000000,
            "kindMainTag": 15000029,
            "deviceTypes": [
              {"deviceType": 4, "appAdapters": "5"}
            ]
          }
          JSON

          node "$cli_js" publish app-info-update             -a "$AGC_APP_ID"             --body "$body_path"             -r 1

          echo "AGC metadata ready: CN + phone(main) + tablet(adapter) + 工具/写作"

      - name: Install HarmonyOS project dependencies
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/harmony
        shell: bash
        run: ohpm install

      - name: Ensure Rust toolchain
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build and sign HarmonyOS APP
        if: steps.secrets.outputs.ready == 'true'
        id: build
        shell: bash
        env:
          HARMONY_SIGN_STORE_PASSWORD: ${{ secrets.HARMONY_SIGN_STORE_PASSWORD }}
          HARMONY_SIGN_KEY_ALIAS: ${{ secrets.HARMONY_SIGN_KEY_ALIAS }}
          HARMONY_SIGN_KEY_PASSWORD: ${{ secrets.HARMONY_SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          from tools.publish_harmony_test import build_release_app

          app_path = build_release_app(False).resolve()
          if not app_path.is_file():
              raise SystemExit(f"Signed APP not found: {app_path}")

          with Path(sys.argv[1]).open("a", encoding="utf-8") as handle:
              handle.write(f"app_path={app_path}\n")
          print(f"Signed APP: {app_path}")
          PY

      - name: Deploy to AGC invitation testing
        if: steps.secrets.outputs.ready == 'true'
        id: agc
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ steps.agc_credentials.outputs.json }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_APP_PATH: ${{ steps.build.outputs.app_path }}
        run: |
          set -euo pipefail

          action_dir="$RUNNER_TEMP/deploy-to-agc-testing"
          rm -rf "$action_dir"
          git clone --depth 1 --branch v2             https://github.com/Eilgnaw/deploy-to-agc-testing.git             "$action_dir"
          git -C "$action_dir" rev-parse HEAD
          test "$(git -C "$action_dir" rev-parse HEAD)" = "e3ea3b6b1c30864f4e4f8fbeb3e6322580ee9330"

          python3 - "$action_dir/src/testing.ts" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          import_anchor = "import * as core from '@actions/core'\n"
          import_replacement = """import * as core from '@actions/core'
          import * as fs from 'fs'
          import * as nodePath from 'path'
          import { computeFileSha256, getUploadUrl, uploadFile } from './upload'
          """
          if source.count(import_anchor) != 1:
              raise SystemExit(
                  f"Pinned upstream import anchor count={source.count(import_anchor)}; refusing blind patch"
              )
          source = source.replace(import_anchor, import_replacement, 1)

          device_anchor = "    pkgId: opts.pkgId\n  }"
          device_replacement = """    pkgId: opts.pkgId
          }

          // Huawei test-version metadata is separate from app-level metadata.
          ;(body as any).deviceTypes = [
            { deviceType: 4, appAdapters: '5' }
          ]
          ;(body as any).distCountryList = 'CN'
          ;(body as any).extInfo = {
            privacyPolicy: 'https://github.com/Xiwei753/xiezuoruanjian/blob/main/PRIVACY.md',
            privacyRightsUrl: 'https://github.com/Xiwei753/xiezuoruanjian/blob/main/PRIVACY.md',
            encrypted: 0
          }"""
          if source.count(device_anchor) != 1:
              raise SystemExit(
                  f"Pinned upstream pkgId anchor count={source.count(device_anchor)}; refusing blind patch"
              )
          source = source.replace(device_anchor, device_replacement, 1)

          language_start_token = "  if (opts.testContent) {"
          language_end_token = "\n\n  if (opts.groupId || opts.testDesc) {"
          language_start = source.find(language_start_token)
          language_end = source.find(language_end_token, language_start)
          if language_start < 0 or language_end < 0:
              raise SystemExit(
                  f"Pinned upstream languages block bounds not found: start={language_start}, end={language_end}"
              )

          language_replacement = """  // AGC validates the version icon during submit.
          const iconPath = nodePath.resolve('apps/harmony/AppScope/resources/base/media/app_icon.png')
          if (!fs.existsSync(iconPath)) {
            throw new Error('HarmonyOS AGC app icon file is missing')
          }
          const iconStats = fs.statSync(iconPath)
          const iconSha256 = await computeFileSha256(iconPath)
          const iconUpload = await getUploadUrl(
            client,
            appId,
            nodePath.basename(iconPath),
            iconStats.size,
            iconSha256,
            6
          )
          await uploadFile(iconUpload.urlInfo, iconPath)
          const iconObjectId = iconUpload.urlInfo.objectId
          core.info('Uploaded HarmonyOS test-version app icon')

          // HarmonyOS multi-device test submission requires version-level language metadata.
          ;(body as any).languages = [{
            language: opts.agcLanguage || 'zh-CN',
            appName: '素笺',
            appDesc: '素笺写作是一款面向个人创作的写作应用。',
            briefInfo: '简洁的个人写作工具',
            newFeatures: opts.testContent || opts.testDesc || '素笺自动测试版本',
            deviceMaterials: [
              { deviceType: 4, appIcon: iconObjectId },
              { deviceType: 5, appIcon: iconObjectId }
            ]
          }]"""
          source = source[:language_start] + language_replacement + source[language_end:]
          path.write_text(source, encoding="utf-8")
          PY

          npm --prefix "$action_dir" ci
          npm --prefix "$action_dir" run package

          env             "INPUT_SERVICE-ACCOUNT-JSON=$AGC_SERVICE_ACCOUNT_JSON"             "INPUT_APP-ID=$AGC_APP_ID"             "INPUT_APP-PATH=$AGC_APP_PATH"             "INPUT_LANGUAGE=zh-Hans"             "INPUT_TEST-DESC=素笺自动测试版"             "INPUT_RELEASE-TYPE=6"             "INPUT_TEST-TYPE=3"             "INPUT_TEST-GROUP-NAME=Sujian CI"             "INPUT_GENERATE-INVITE-CODE=false"             node "$action_dir/dist/index.js"

      - name: Print AGC result
        if: steps.secrets.outputs.ready == 'true' && success()
        shell: bash
        run: |
          echo "Version ID: ${{ steps.agc.outputs.version-id }}"
          echo "Package ID: ${{ steps.agc.outputs.pkg-version }}"
          echo "Group ID: ${{ steps.agc.outputs.group-id }}"
