name: Sujian Windows Qt x64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/windows/qt/**'
      - 'apps/Linux_qt/**'
      - 'apps/sujian_mcp/**'
      - 'core/**'
      - 'crates/**'
      - 'platform/rust/windows/**'
      - 'third_party/libgit2-sys/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows_qt_build.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows Qt x64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Qt 6.11 MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # aqtinstall 3.3.0 cannot parse the official Qt 6.11+ Windows
          # repository layout (upstream miurahr/aqtinstall#1000).
          # Pin a commit containing that upstream fix until the next release.
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7"
          if ($LASTEXITCODE -ne 0) { throw "Installing patched aqtinstall failed" }
          $qtDirBase = Join-Path $env:GITHUB_WORKSPACE "_qt"
          python -m aqt install-qt windows desktop 6.11.3 win64_msvc2022_64 --outputdir $qtDirBase --modules qtshadertools
          if ($LASTEXITCODE -ne 0) { throw "Installing Qt 6.11.3 failed" }
          $qtDir = Join-Path $qtDirBase "6.11.3/msvc2022_64"
          if (-not (Test-Path -LiteralPath (Join-Path $qtDir "bin/qmake.exe"))) {
            throw "Qt 6.11.3 installation missing qmake.exe: $qtDir"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QT_ROOT_DIR=$qtDir"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QT_PLUGIN_PATH=$(Join-Path $qtDir 'plugins')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QML2_IMPORT_PATH=$(Join-Path $qtDir 'qml')"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $qtDir "bin")

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sujian-windows-qt-x64

      - name: Cache Windows correction model
        uses: actions/cache@v4
        with:
          path: apps/windows/qt/generated/correction/
          key: windows-correction-v1-${{ hashFiles('crates/sujian-proof/assets/model_manifest.json') }}

      - name: Build and deploy Windows Qt
        shell: pwsh
        run: |
          & ./apps/windows/qt/scripts/build.ps1 -Configuration release -QtRoot $env:QT_ROOT_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows Qt QML startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deployDir = (Resolve-Path "./apps/windows/qt/dist/release").Path
          $exe = Join-Path $deployDir "sujian-windows-qt.exe"
          $offscreen = Join-Path $env:QT_ROOT_DIR "plugins/platforms/qoffscreen.dll"
          if (-not (Test-Path -LiteralPath $offscreen)) {
            throw "Qt offscreen platform plugin missing: $offscreen"
          }
          Copy-Item -LiteralPath $offscreen -Destination (Join-Path $deployDir "platforms") -Force

          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $env:SUJIAN_QML_PROBE = "1"
          $env:QML_IMPORT_TRACE = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "sujian-qml-probe-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "sujian-qml-probe-stderr.txt"
          $process = Start-Process -FilePath $exe -WorkingDirectory $deployDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            if (-not $process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Windows Qt QML startup did not finish within 45 seconds"
            }
            $code = $process.ExitCode
          } finally {
            Write-Host "--- Windows QML startup stdout ---"
            if (Test-Path $stdout) { Get-Content -LiteralPath $stdout -Tail 70 | ForEach-Object { Write-Host $_ } }
            Write-Host "--- Windows QML startup stderr ---"
            if (Test-Path $stderr) { Get-Content -LiteralPath $stderr -Tail 160 | ForEach-Object { Write-Host $_ } }
          }
          if ($code -ne 0) { throw "Windows Qt QML startup failed: exit code $code" }
          if (-not (Select-String -LiteralPath $stderr -Pattern "SUJIAN_QML_PROBE_OK" -Quiet)) {
            throw "Windows Qt QML startup did not reach the loaded state"
          }

      - name: Upload Windows Qt portable package
        uses: actions/upload-artifact@v7
        with:
          name: sujian-windows-qt-x64
          path: apps/windows/qt/dist/release/
          if-no-files-found: error
          compression-level: 0
