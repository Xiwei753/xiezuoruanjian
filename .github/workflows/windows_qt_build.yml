name: Sujian Windows Qt x64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/windows/qt/**'
      - 'apps/Linux_qt/**'
      - 'apps/sujian_mcp/**'
      - 'core/**'
      - 'crates/**'
      - 'platform/rust/windows/**'
      - 'third_party/libgit2-sys/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows_qt_build.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows Qt x64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Qt 6.11 MSVC and KDE runtime via Craft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Windows 便携包必须携带真正的 KDE Kirigami / KirigamiAddons /
          # qqc2-desktop-style / KIconThemes / Breeze 运行时，与 Linux 共享 QML
          # （Kirigami.ApplicationWindow、FormCard 等）保持同一实现。
          # 使用 KDE Craft (packaging/craft) 安装；Craft 同时提供本项目构建所需
          # 的 Qt 6 MSVC x64，以此统一 Qt/KDE 的 ABI 来源，不并存两套 Qt。

          # 1. 先安装 certifi（GitHub Actions Windows runner 的 Python 可能没有），
          #    再设置 TLS 环境变量。CraftBootstrap.py 在 Windows 上依赖 certifi
          #    设置 SSLContext，否则 invent.kde.org 的证书验证会失败。
          python -m pip install certifi
          if ($LASTEXITCODE -ne 0) { throw "pip install certifi failed" }
          $certBundle = python -c "import certifi; print(certifi.where())"
          if ($LASTEXITCODE -ne 0) { throw "Failed to locate certifi CA bundle" }
          $env:SSL_CERT_FILE = $certBundle
          $env:REQUESTS_CA_BUNDLE = $certBundle
          $env:CURL_CA_BUNDLE = $certBundle

          # 2. 克隆 Craft 并固定到与 26.05 Windows 缓存匹配的提交。
          #    提交 760cf4a（2026-05-25）的 CraftCoreSettings.ini 已有
          #    CacheVersion = 26.05，CraftSettings.ini.template 已有
          #    BuildType = RelWithDebInfo，与官方 26.05 RelWithDebInfo 缓存
          #    （344 个包）完全匹配。使用 master（26.10 配方）拼 26.05 缓存
          #    会导致包版本不一致和 manifest 404。
          $craftSource = Join-Path $env:RUNNER_TEMP "craft-source"
          git clone --depth=1 https://invent.kde.org/packaging/craft.git $craftSource
          git -C $craftSource fetch --depth=1 origin 760cf4a90e8f0a8eeca2d102b337114b706d83d3
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch Craft commit 760cf4a" }
          git -C $craftSource checkout FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to checkout Craft commit 760cf4a" }

          # 修改 CMake 下载源：cmake.org TLS 证书链验证失败（curl 60），
          # 将 cmake.org/files/ 替换为 Kitware GitHub releases。
          $cmakeBlueprint = Join-Path $craftSource "blueprints\dev-utils\cmake-base\cmake-base.py"
          $content = Get-Content -LiteralPath $cmakeBlueprint -Raw
          $content = $content -replace 'https://cmake\.org/files/v\{majorMinorStr\}/cmake-\{ver\}-windows-', 'https://github.com/Kitware/CMake/releases/download/v{ver}/cmake-{ver}-windows-'
          $content = $content -replace 'https://cmake\.org/files/v\{majorMinorStr\}/cmake-\{ver\}-SHA-256\.txt', 'https://github.com/Kitware/CMake/releases/download/v{ver}/cmake-{ver}-SHA-256.txt'
          Set-Content -LiteralPath $cmakeBlueprint -Value $content -NoNewline

          # 3. 使用 --localDev 启动 bootstrap：将修改过的 Craft 源复制到
          #    craft-tmp 后执行，确保 CMake 源在第一次下载前生效。
          python (Join-Path $craftSource "setup\CraftBootstrap.py") --prefix C:/CraftRoot --branch master --use-defaults --localDev $craftSource
          if ($LASTEXITCODE -ne 0) { throw "Craft bootstrap failed" }

          $craftExe = "C:/CraftRoot/craft/bin/craft.py"
          # Craft 的 --target 是包版本/构建目标，不是平台 ABI；ABI 通过
          # CraftSettings.ini 的 [General] ABI 选择，由 bootstrap 自动写入。
          # 蓝图路径使用完整层级路径（tier1/tier3/unreleased）。
          foreach ($package in @(
            "qt6/qtshadertools",
            "qt6/qttools",
            "kde/frameworks/tier1/kirigami",
            "kde/unreleased/kirigami-addons",
            "kde/frameworks/tier3/kiconthemes",
            "kde/frameworks/tier3/qqc2-desktop-style",
            "kde/frameworks/tier1/breeze-icons"
          )) {
            python $craftExe $package
            if ($LASTEXITCODE -ne 0) { throw "Craft install failed for $package" }
          }
          $craftRoot = "C:/CraftRoot"
          if (-not (Test-Path -LiteralPath (Join-Path $craftRoot "bin/qmake.exe"))) {
            throw "Craft Qt installation missing qmake.exe: $craftRoot"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $craftRoot "qml/org/kde/kirigami/qmldir"))) {
            throw "Craft installation missing org.kde.kirigami QML module: $craftRoot"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CRAFT_ROOT=$craftRoot"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QT_ROOT_DIR=$craftRoot"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QT_PLUGIN_PATH=$(Join-Path $craftRoot 'plugins')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QML2_IMPORT_PATH=$(Join-Path $craftRoot 'qml')"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $craftRoot "bin")

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sujian-windows-qt-x64

      - name: Cache Windows correction model
        uses: actions/cache@v4
        with:
          path: apps/windows/qt/generated/correction/
          key: windows-correction-v1-${{ hashFiles('crates/sujian-proof/assets/model_manifest.json') }}

      - name: Build and deploy Windows Qt
        shell: pwsh
        run: |
          & ./apps/windows/qt/scripts/build.ps1 -Configuration release -QtRoot $env:QT_ROOT_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows Qt QML startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deployDir = (Resolve-Path "./apps/windows/qt/dist/release").Path
          $exe = Join-Path $deployDir "sujian-windows-qt.exe"
          $offscreen = Join-Path $env:QT_ROOT_DIR "plugins/platforms/qoffscreen.dll"
          if (-not (Test-Path -LiteralPath $offscreen)) {
            throw "Qt offscreen platform plugin missing: $offscreen"
          }
          Copy-Item -LiteralPath $offscreen -Destination (Join-Path $deployDir "platforms") -Force

          # 清除 Craft/Qt 开发环境变量，确保 EXE 从便携包目录加载 QML/插件/DLL，
          # 而不是从构建机的 CraftRoot 加载未随包部署的模块。
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $craftBin = (Join-Path $env:CRAFT_ROOT "bin")
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne $craftBin }) -join ';'

          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $env:SUJIAN_QML_PROBE = "1"
          $env:QML_IMPORT_TRACE = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "sujian-qml-probe-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "sujian-qml-probe-stderr.txt"
          $process = Start-Process -FilePath $exe -WorkingDirectory $deployDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            if (-not $process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Windows Qt QML startup did not finish within 45 seconds"
            }
            $code = $process.ExitCode
          } finally {
            Write-Host "--- Windows QML startup stdout ---"
            if (Test-Path $stdout) { Get-Content -LiteralPath $stdout -Tail 70 | ForEach-Object { Write-Host $_ } }
            Write-Host "--- Windows QML startup stderr ---"
            if (Test-Path $stderr) { Get-Content -LiteralPath $stderr -Tail 160 | ForEach-Object { Write-Host $_ } }
          }
          if ($code -ne 0) { throw "Windows Qt QML startup failed: exit code $code" }
          if (-not (Select-String -LiteralPath $stderr -Pattern "SUJIAN_QML_PROBE_OK" -Quiet)) {
            throw "Windows Qt QML startup did not reach the loaded state"
          }

      - name: Upload Windows Qt portable package
        uses: actions/upload-artifact@v7
        with:
          name: sujian-windows-qt-x64
          path: apps/windows/qt/dist/release/
          if-no-files-found: error
          compression-level: 0
