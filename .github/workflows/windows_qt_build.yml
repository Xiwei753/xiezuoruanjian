name: Sujian Windows Qt x64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/windows/qt/**'
      - 'apps/Linux_qt/**'
      - 'apps/sujian_mcp/**'
      - 'core/**'
      - 'crates/**'
      - 'platform/rust/windows/**'
      - 'third_party/libgit2-sys/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows_qt_build.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows Qt x64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Qt 6.11 MSVC and KDE runtime via Craft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Windows 便携包必须携带真正的 KDE Kirigami / KirigamiAddons /
          # qqc2-desktop-style / KIconThemes / Breeze 运行时，与 Linux 共享 QML
          # （Kirigami.ApplicationWindow、FormCard 等）保持同一实现。
          # 按 KDE 官方文档用 Craft 安装（develop.kde.org/docs/getting-started/
          # kirigami/setup-cpp/）；Craft 同时提供本项目构建所需的 Qt 6.11 MSVC
          # x64，以此统一 Qt/KDE 的 ABI 来源，不并存两套 Qt。KDE CI 使用同一
          # CraftConfig.ini，其缓存服务器提供 MSVC 预编译二进制。
          git clone --depth=1 https://invent.kde.org/packaging/ci-utilities.git
          python ci-utilities/prepare-craft.py --platform windows-msvc2022-amd64
          if ($LASTEXITCODE -ne 0) { throw "Preparing KDE Craft failed" }
          foreach ($package in @(
            "qt6/qtshadertools",
            "qt6/qttools",
            "kde/kirigami",
            "kde/kirigami-addons",
            "kde/kiconthemes",
            "kde/qqc2-desktop-style",
            "kde/breeze"
          )) {
            python CraftRoot/bin/craft.py --target windows-msvc2022-amd64 $package
            if ($LASTEXITCODE -ne 0) { throw "Craft install failed for $package" }
          }
          $craftRoot = (Resolve-Path "./CraftRoot").Path
          if (-not (Test-Path -LiteralPath (Join-Path $craftRoot "bin/qmake.exe"))) {
            throw "Craft Qt installation missing qmake.exe: $craftRoot"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $craftRoot "qml/org/kde/kirigami/qmldir"))) {
            throw "Craft installation missing org.kde.kirigami QML module: $craftRoot"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CRAFT_ROOT=$craftRoot"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QT_ROOT_DIR=$craftRoot"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QT_PLUGIN_PATH=$(Join-Path $craftRoot 'plugins')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QML2_IMPORT_PATH=$(Join-Path $craftRoot 'qml')"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $craftRoot "bin")

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sujian-windows-qt-x64

      - name: Cache Windows correction model
        uses: actions/cache@v4
        with:
          path: apps/windows/qt/generated/correction/
          key: windows-correction-v1-${{ hashFiles('crates/sujian-proof/assets/model_manifest.json') }}

      - name: Build and deploy Windows Qt
        shell: pwsh
        run: |
          & ./apps/windows/qt/scripts/build.ps1 -Configuration release -QtRoot $env:QT_ROOT_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows Qt QML startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deployDir = (Resolve-Path "./apps/windows/qt/dist/release").Path
          $exe = Join-Path $deployDir "sujian-windows-qt.exe"
          $offscreen = Join-Path $env:QT_ROOT_DIR "plugins/platforms/qoffscreen.dll"
          if (-not (Test-Path -LiteralPath $offscreen)) {
            throw "Qt offscreen platform plugin missing: $offscreen"
          }
          Copy-Item -LiteralPath $offscreen -Destination (Join-Path $deployDir "platforms") -Force

          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $env:SUJIAN_QML_PROBE = "1"
          $env:QML_IMPORT_TRACE = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "sujian-qml-probe-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "sujian-qml-probe-stderr.txt"
          $process = Start-Process -FilePath $exe -WorkingDirectory $deployDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            if (-not $process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Windows Qt QML startup did not finish within 45 seconds"
            }
            $code = $process.ExitCode
          } finally {
            Write-Host "--- Windows QML startup stdout ---"
            if (Test-Path $stdout) { Get-Content -LiteralPath $stdout -Tail 70 | ForEach-Object { Write-Host $_ } }
            Write-Host "--- Windows QML startup stderr ---"
            if (Test-Path $stderr) { Get-Content -LiteralPath $stderr -Tail 160 | ForEach-Object { Write-Host $_ } }
          }
          if ($code -ne 0) { throw "Windows Qt QML startup failed: exit code $code" }
          if (-not (Select-String -LiteralPath $stderr -Pattern "SUJIAN_QML_PROBE_OK" -Quiet)) {
            throw "Windows Qt QML startup did not reach the loaded state"
          }

      - name: Upload Windows Qt portable package
        uses: actions/upload-artifact@v7
        with:
          name: sujian-windows-qt-x64
          path: apps/windows/qt/dist/release/
          if-no-files-found: error
          compression-level: 0
