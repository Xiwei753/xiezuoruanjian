name: HarmonyOS Static Analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/harmony/**'
      - 'core/writer_core/**'
      - 'platform/rust/harmony/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/build_harmony*'
      - 'tools/setup_harmony_cli.sh'
      - 'tools/check_codelinter_report.py'
      - 'tools/check_harmony_share_files.py'
      - 'tools/test_check_harmony_share_files.py'
      - '.github/workflows/harmony_static_analysis.yml'

permissions:
  contents: read

jobs:
  harmony-static-analysis:
    name: HarmonyOS ArkTS Lint & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup HarmonyOS CLI
        run: |
          source tools/setup_harmony_cli.sh
          echo "HARMONY_CLI_HOME=$HARMONY_CLI_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$HARMONY_CLI_HOME/sdk" >> "$GITHUB_ENV"
          echo "$HARMONY_CLI_HOME/tool/node/bin" >> "$GITHUB_PATH"
          echo "$HARMONY_CLI_HOME/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: apps/harmony
        run: ohpm install

      - name: Run validate.mjs
        working-directory: apps/harmony
        run: node validate.mjs

      - name: Test shareFiles profile checker
        run: python3 tools/test_check_harmony_share_files.py

      - name: Check shareFiles profile（SDK schema + 官方路径限制）
        run: python3 tools/check_harmony_share_files.py .

      - name: Run codelinter
        working-directory: apps/harmony
        run: codelinter -f json -o "$RUNNER_TEMP/codelinter-report.json"

      - name: Check codelinter report
        run: python3 tools/check_codelinter_report.py "$RUNNER_TEMP/codelinter-report.json"

      - name: Setup Rust toolchain
        run: rustup target add aarch64-unknown-linux-ohos

      - name: Build Rust FFI library
        run: |
          export OHOS_NDK_HOME="$HARMONY_CLI_HOME/sdk/default/openharmony/native"
          bash tools/build_harmony.sh

      - name: Compile ArkTS
        working-directory: apps/harmony
        run: hvigorw --mode module -p module=entry@default -p product=default -p buildMode=debug default@CompileArkTS
