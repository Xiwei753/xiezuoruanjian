name: Linux Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev qt6-declarative-dev libqt6core6 libqt6gui6 libqt6qml6 libqt6quick6 qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-dialogs
        sudo apt-get install -y libglib2.0-dev libgtk-3-dev

    - name: Build
      run: cargo build -p linux

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: writer-linux
        path: target/debug/linux
