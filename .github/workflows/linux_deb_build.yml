name: Sujian Linux DEB Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/Linux_qt/**'
      - 'core/**'
      - 'crates/**'
      - 'platform/rust/linux/**'
      - 'packaging/deb/**'
      - 'packaging/linux/**'
      - 'packaging/correction/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/linux_deb_build.yml'

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/deb-cargo

jobs:
  deb:
    name: Build Debian 13 DEB
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Debian build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 build-essential pkg-config cmake \
            libssl-dev dpkg-dev \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools \
            libkf6colorscheme-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-deb-trixie
          workspaces: ". -> target/deb-cargo"
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Build DEB
        run: bash packaging/deb/build-deb.sh

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: sujian-linux-deb
          path: dist/deb/*.deb
          if-no-files-found: error
          compression-level: 0
