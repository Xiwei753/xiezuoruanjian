# 第一阶段：只构建无签名/调试 HAP，签名后续通过 GitHub Secrets 注入

name: Harmony Build

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/harmony/**"
      - ".github/workflows/harmony_build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/harmony

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup OpenHarmony SDK
        id: setup-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: '5.0.0'
          cache: 'true'
          fixup-path: 'true'

      - name: Download HarmonyOS command-line tools (for ohpm)
        run: |
          cd $RUNNER_TEMP
          wget -q -O commandline-tools-linux.zip https://image.cdn.dog/commandline-tools-linux-x64-6.0.2.642.zip
          echo "181d283be91392e0a5dc09caf5ebda34c778cccc9985d8a97a814808452e2471  commandline-tools-linux.zip" | sha256sum -c -
          unzip -q commandline-tools-linux.zip -d harmony-tools
          echo "COMMANDLINE_TOOL_DIR=$RUNNER_TEMP/harmony-tools/command-line-tools" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/harmony-tools/command-line-tools/bin" >> $GITHUB_PATH

      - name: Reorganize SDK for hvigor compatibility
        run: |
          # setup-ohos-sdk puts components under ~/setup-ohos-sdk/linux/{component}/
          # hvigor expects DEVECO_SDK_HOME to have structure:
          #   {sdk-root}/default/openharmony/{api-version}/ets/
          #   {sdk-root}/default/openharmony/{api-version}/native/
          #
          # With fixup-path=true, components are under ~/setup-ohos-sdk/linux/{api-version}/{component}/
          # We need to reorganize this into the expected structure.

          SDK_SRC="$HOME/setup-ohos-sdk/linux"
          SDK_DST="$RUNNER_TEMP/harmony-sdk"

          echo "=== Source SDK structure ==="
          find "$SDK_SRC" -maxdepth 3 -type d | sort || true

          API_VERSION="${{ steps.setup-sdk.outputs.api-version }}"
          echo "API version from action: $API_VERSION"

          # If API_VERSION is empty, try to detect it from directory
          if [ -z "$API_VERSION" ]; then
            API_VERSION=$(ls "$SDK_SRC" | head -1)
            echo "Detected API version from directory: $API_VERSION"
          fi

          # Create the hvigor-expected directory structure
          mkdir -p "$SDK_DST/default/openharmony/$API_VERSION"

          # Copy all component directories into the expected structure
          if [ -d "$SDK_SRC/$API_VERSION" ]; then
            # fixup-path=true: components are under {api-version}/
            cp -r "$SDK_SRC/$API_VERSION"/* "$SDK_DST/default/openharmony/$API_VERSION/" 2>/dev/null || true
          else
            # fixup-path=false: components are directly under linux/
            cp -r "$SDK_SRC"/* "$SDK_DST/default/openharmony/$API_VERSION/" 2>/dev/null || true
          fi

          echo "=== Reorganized SDK structure ==="
          find "$SDK_DST" -maxdepth 4 -type d | sort || true

          echo "DEVECO_SDK_HOME=$SDK_DST" >> $GITHUB_ENV
          echo "OHOS_SDK_HOME=$SDK_DST" >> $GITHUB_ENV
          echo "HOS_SDK_HOME=$SDK_DST" >> $GITHUB_ENV

      - name: Show tool versions
        run: |
          node -v || true
          ohpm -v || true
          echo "SDK path: ${{ steps.setup-sdk.outputs.sdk-path }}"
          echo "SDK version: ${{ steps.setup-sdk.outputs.sdk-version }}"
          echo "API version: ${{ steps.setup-sdk.outputs.api-version }}"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          echo "OHOS_BASE_SDK_HOME=$OHOS_BASE_SDK_HOME"

      - name: Check hvigorw
        run: |
          if [ ! -f "./hvigorw" ]; then
            echo "ERROR: apps/harmony/hvigorw not found."
            exit 1
          fi
          chmod +x ./hvigorw

      - name: Apply CI build profile (no signing)
        run: |
          cp build-profile.ci.json5 build-profile.json5
          cp oh-package.ci.json5 oh-package.json5
          # OpenHarmony SDK doesn't have device-define for "phone"/"tablet",
          # must use "default" to avoid SyscapTransform error 00303060.
          # Replace the entire deviceTypes array to avoid duplicate "default" values.
          sed -i '/"deviceTypes"/,/]/c\      "deviceTypes": [\n        "default"\n      ],' entry/src/main/module.json5

      - name: Install Rust target for OHOS
        run: |
          rustup target add aarch64-unknown-linux-ohos

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Rust writer_core FFI for OHOS
        working-directory: ${{ github.workspace }}
        run: |
          # Use Ubuntu's aarch64-linux-gnu-gcc as cross-linker for OHOS target.
          # The OpenHarmony SDK only provides headers/libs, not a C compiler.
          # aarch64-linux-gnu-gcc produces compatible ELF binaries for aarch64-linux-ohos.
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="aarch64-linux-gnu-gcc"

          echo "Using linker: $CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER"
          aarch64-linux-gnu-gcc --version | head -1

          cd core/writer_core
          cargo build --target aarch64-unknown-linux-ohos --release --no-default-features --features harmony-ffi

          # Copy .so to prebuilt directory
          PREBUILT_DIR="$GITHUB_WORKSPACE/apps/harmony/entry/src/main/prebuilt/arm64-v8a"
          mkdir -p "$PREBUILT_DIR"
          cp "$GITHUB_WORKSPACE/target/aarch64-unknown-linux-ohos/release/libwriter_core.so" \
             "$PREBUILT_DIR/libwriter_core_ffi.so"
          echo "Built libwriter_core_ffi.so:"
          ls -lh "$PREBUILT_DIR/libwriter_core_ffi.so"

      - name: Install hvigor dependencies via npm
        run: |
          mkdir -p node_modules/@ohos

          echo "Downloading @ohos/hvigor@6.26.1..."
          wget -q -O /tmp/hvigor.tgz "https://repo.harmonyos.com/npm/@ohos/hvigor/-/@ohos/hvigor-6.26.1.tgz"
          mkdir -p node_modules/@ohos/hvigor
          tar xzf /tmp/hvigor.tgz -C node_modules/@ohos/hvigor --strip-components=1

          echo "Downloading @ohos/hvigor-ohos-plugin@6.26.1..."
          wget -q -O /tmp/hvigor-plugin.tgz "https://repo.harmonyos.com/npm/@ohos/hvigor-ohos-plugin/-/@ohos/hvigor-ohos-plugin-6.26.1.tgz"
          mkdir -p node_modules/@ohos/hvigor-ohos-plugin
          tar xzf /tmp/hvigor-plugin.tgz -C node_modules/@ohos/hvigor-ohos-plugin --strip-components=1

          echo "Verifying installation..."
          ls -la node_modules/@ohos/
          node -e "console.log('hvigor version:', require('./node_modules/@ohos/hvigor/package.json').version)"
          node -e "console.log('plugin version:', require('./node_modules/@ohos/hvigor-ohos-plugin/package.json').version)"
          ls -la ./node_modules/@ohos/hvigor/bin/hvigor.js

      - name: Install OpenHarmony dependencies via ohpm
        run: |
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all || true

      - name: Build HAP via hvigor directly
        env:
          npm_config_registry: https://repo.harmonyos.com/npm/
          NODE_PATH: ${{ github.workspace }}/apps/harmony/node_modules
        shell: bash
        run: |
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          echo "OHOS_SDK_HOME=$OHOS_SDK_HOME"
          echo "NODE_PATH=$NODE_PATH"
          find "$DEVECO_SDK_HOME" -maxdepth 5 -type d | sort || true
          find "$DEVECO_SDK_HOME" -name "oh-uni-package.json" -exec cat {} \; 2>/dev/null || true
          node ./node_modules/@ohos/hvigor/bin/hvigor.js assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace > /tmp/hvigor-output.txt 2>&1 || true
          # Write output to step summary for visibility without log download
          echo "### hvigor build output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/hvigor-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Also print to job log
          cat /tmp/hvigor-output.txt
          # Check if build failed
          if grep -q "ERROR" /tmp/hvigor-output.txt; then
            echo "::error::hvigor build failed, see Step Summary for details"
            exit 1
          fi

      - name: List outputs
        run: |
          find entry/build -maxdepth 8 -type f | sort || true

      - name: Upload Harmony output
        uses: actions/upload-artifact@v4
        with:
          name: sujian-harmony-output
          path: apps/harmony/entry/build/default/outputs/default/**
          if-no-files-found: warn
