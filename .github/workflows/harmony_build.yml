# 第一阶段：只构建无签名/调试 HAP，签名后续通过 GitHub Secrets 注入

name: Harmony Build

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/harmony/**"
      - ".github/workflows/harmony_build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/harmony

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download HarmonyOS command-line tools
        run: |
          cd $RUNNER_TEMP
          wget -q -O commandline-tools-linux.zip https://image.cdn.dog/commandline-tools-linux-x64-6.0.2.642.zip
          echo "181d283be91392e0a5dc09caf5ebda34c778cccc9985d8a97a814808452e2471  commandline-tools-linux.zip" | sha256sum -c -
          unzip -q commandline-tools-linux.zip -d harmony-tools
          echo "COMMANDLINE_TOOL_DIR=$RUNNER_TEMP/harmony-tools/command-line-tools" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/harmony-tools/command-line-tools/bin" >> $GITHUB_PATH

      - name: Show tool versions
        run: |
          node -v || true
          ohpm -v || true
          ls -la ./hvigorw || true
          ls -la ./hvigor/hvigor-wrapper.js || true

      - name: Check hvigorw
        run: |
          if [ ! -f "./hvigorw" ]; then
            echo "ERROR: apps/harmony/hvigorw not found."
            exit 1
          fi
          chmod +x ./hvigorw

      - name: Apply CI build profile (no signing)
        run: |
          cp build-profile.ci.json5 build-profile.json5
          cp oh-package.ci.json5 oh-package.json5

      - name: Install hvigor dependencies via npm
        run: |
          # ohpm.harmonyos.com domain does not exist in public DNS.
          # Use npm to fetch packages from repo.harmonyos.com (Huawei's npm-compatible registry)
          npm install @ohos/hvigor@6.26.1 @ohos/hvigor-ohos-plugin@6.26.1 \
            --registry=https://repo.harmonyos.com/npm/ \
            --prefix=.

      - name: Install OpenHarmony dependencies via ohpm
        run: |
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all || true

      - name: Build HAP via hvigor directly
        env:
          # Tell hvigor's bundled pnpm to use Huawei's npm-compatible registry
          # instead of the default ohpm registry which is inaccessible from CI
          npm_config_registry: https://repo.harmonyos.com/npm/
        run: |
          # Run hvigor directly from node_modules instead of via hvigorw wrapper.
          # hvigor's initNodePath() will create a workspace and run pnpm install
          # there. With npm_config_registry set, pnpm can resolve @ohos packages
          # from repo.harmonyos.com. Additionally, adaptNode14Module() patches
          # require() to resolve from the project's node_modules as fallback.
          export NODE_PATH=$(pwd)/node_modules
          node ./node_modules/@ohos/hvigor/bin/hvigor.js clean --no-daemon 2>&1 || true
          node ./node_modules/@ohos/hvigor/bin/hvigor.js assembleHap --mode module -p product=default -p buildMode=debug --no-daemon 2>&1

      - name: List outputs
        run: |
          find entry/build -maxdepth 8 -type f | sort || true

      - name: Upload Harmony output
        uses: actions/upload-artifact@v4
        with:
          name: sujian-harmony-output
          path: apps/harmony/entry/build/default/outputs/default/**
          if-no-files-found: warn
