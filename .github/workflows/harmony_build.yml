# 第一阶段：只构建无签名/调试 HAP，签名后续通过 GitHub Secrets 注入

name: Harmony Build

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/harmony/**"
      - ".github/workflows/harmony_build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/harmony

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download HarmonyOS command-line tools
        run: |
          cd $RUNNER_TEMP
          wget -q -O commandline-tools-linux.zip https://image.cdn.dog/commandline-tools-linux-x64-6.0.2.642.zip
          echo "181d283be91392e0a5dc09caf5ebda34c778cccc9985d8a97a814808452e2471  commandline-tools-linux.zip" | sha256sum -c -
          unzip -q commandline-tools-linux.zip -d harmony-tools
          echo "COMMANDLINE_TOOL_DIR=$RUNNER_TEMP/harmony-tools/command-line-tools" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/harmony-tools/command-line-tools/bin" >> $GITHUB_PATH

      - name: Show tool versions
        run: |
          node -v || true
          ohpm -v || true
          ls -la
          ls -la ./hvigorw || true

      - name: Check hvigorw
        run: |
          if [ ! -f "./hvigorw" ]; then
            echo "ERROR: apps/harmony/hvigorw not found. Open the project once in DevEco Studio or add the hvigor wrapper."
            exit 1
          fi
          chmod +x ./hvigorw

      - name: Apply CI build profile (no signing)
        run: |
          cp build-profile.ci.json5 build-profile.json5
          cp oh-package.ci.json5 oh-package.json5

      - name: Configure ohpm registry
        run: ohpm config set registry https://ohpm.harmonyos.com/ohpm/

      - name: Install Harmony dependencies
        run: ohpm install --all

      - name: Build HAP
        run: |
          ./hvigorw clean --no-daemon
          ./hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: List outputs
        run: |
          find entry/build -maxdepth 8 -type f | sort

      - name: Upload Harmony output
        uses: actions/upload-artifact@v4
        with:
          name: sujian-harmony-output
          path: apps/harmony/entry/build/default/outputs/default/**
