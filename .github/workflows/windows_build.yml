name: Sujian Windows Build

on:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'core/writer_core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'core/writer_core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows exe (${{ matrix.flavor }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: no-ai
            features: ''
          - flavor: ai
            features: '--features ai'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python (required for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        id: install-qt
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configure Qt environment variables
        shell: pwsh
        run: |
          $qtPath = $env:QT_ROOT_DIR
          $qmakePath = Join-Path $qtPath "bin\qmake.exe"
          "QMAKE=$qmakePath" >> $env:GITHUB_ENV
          "QT_VERSION_MAJOR=6" >> $env:GITHUB_ENV
          "QT_INCLUDE_PATH=$qtPath\include" >> $env:GITHUB_ENV
          "QT_LIBRARY_PATH=$qtPath\lib" >> $env:GITHUB_ENV
          $env:Path += ";$qtPath\bin"
          "PATH=$env:Path" >> $env:GITHUB_ENV
          "CXXFLAGS=/std:c++17" >> $env:GITHUB_ENV

      - name: Test Rust core
        run: cargo test -p writer_core ${{ matrix.features }}

      - name: Test Windows desktop contracts
        run: cargo test -p sujian-desktop ${{ matrix.features }}

      - name: Build Windows desktop
        run: cargo build -p sujian-desktop --release ${{ matrix.features }}

      - name: Package with windeployqt
        shell: pwsh
        run: |
          $buildDir = "target/release/sujian-windows-${{ matrix.flavor }}"
          New-Item -ItemType Directory -Force -Path $buildDir
          Copy-Item target/release/sujian-desktop.exe "$buildDir\sujian-windows-${{ matrix.flavor }}.exe"
          $qmldir = "apps/desktop/qml"
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          & $windeployqt --qmldir $qmldir "$buildDir\sujian-windows-${{ matrix.flavor }}.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: sujian-windows-${{ matrix.flavor }}
          path: target/release/sujian-windows-${{ matrix.flavor }}
          retention-days: 30
