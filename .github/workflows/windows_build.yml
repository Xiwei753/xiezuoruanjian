name: Sujian Windows Build

on:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'core/writer_core/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows_build.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'core/writer_core/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows_build.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows exe (${{ matrix.flavor }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: no-ai
            features: ''
          - flavor: ai
            features: '--features ai'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure UTF-8 environment
        shell: pwsh
        run: |
          "PYTHONUTF8=1" >> $env:GITHUB_ENV
          "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
          chcp 65001

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python (required for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        id: install-qt
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Configure Qt environment variables
        shell: pwsh
        run: |
          $qtPath = $env:QT_ROOT_DIR
          $qmakePath = Join-Path $qtPath "bin\qmake.exe"
          "QMAKE=$qmakePath" >> $env:GITHUB_ENV
          "QT_VERSION_MAJOR=6" >> $env:GITHUB_ENV
          "QT_INCLUDE_PATH=$qtPath\include" >> $env:GITHUB_ENV
          "QT_LIBRARY_PATH=$qtPath\lib" >> $env:GITHUB_ENV
          $env:Path += ";$qtPath\bin"
          "PATH=$env:Path" >> $env:GITHUB_ENV
          "CXXFLAGS=/std:c++17" >> $env:GITHUB_ENV

      - name: Test Rust core
        run: cargo test -p writer_core ${{ matrix.features }}

      - name: Test Windows desktop contracts
        run: cargo test -p sujian-desktop ${{ matrix.features }}

      - name: Build Windows desktop
        run: cargo build -p sujian-desktop --release ${{ matrix.features }}

      - name: Package with windeployqt
        shell: pwsh
        run: |
          $buildDir = "target/release/sujian-windows-${{ matrix.flavor }}"
          New-Item -ItemType Directory -Force -Path $buildDir
          Copy-Item target/release/sujian-desktop.exe "$buildDir\sujian-windows-${{ matrix.flavor }}.exe"
          $qmldir = "apps/desktop/qml"
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          & $windeployqt --qmldir $qmldir "$buildDir\sujian-windows-${{ matrix.flavor }}.exe"
          Copy-Item packaging/windows/start-debug.ps1 "$buildDir\start-debug.ps1"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "$buildDir\vc_redist.x64.exe"

      - name: Sign main executable (optional)
        shell: pwsh
        run: |
          if ($env:SIGNING_CERT_SECRET) {
            $certBytes = [System.Convert]::FromBase64String($env:SIGNING_CERT_SECRET)
            $certPath = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)
            $exePath = "target/release/sujian-windows-${{ matrix.flavor }}/sujian-windows-${{ matrix.flavor }}.exe"
            if (Test-Path $exePath) {
              $signArgs = @("sign", "/f", $certPath, "/tr", "http://timestamp.digicert.com", "/td", "sha256", "/fd", "sha256")
              if ($env:SIGNING_CERT_PASSWORD) {
                $signArgs += @("/p", $env:SIGNING_CERT_PASSWORD)
              }
              $signArgs += $exePath
              & signtool @signArgs
              Write-Host "Main executable signed successfully"
            }
            Remove-Item $certPath -Force
          } else {
            Write-Host "SIGNING_CERT_SECRET not set, skipping main executable signing"
          }
        env:
          SIGNING_CERT_SECRET: ${{ secrets.SIGNING_CERT_SECRET }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "target/release/sujian-windows-${{ matrix.flavor }}\*" -DestinationPath "target/release/sujian-windows-${{ matrix.flavor }}-portable.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Read version from Cargo.toml
        shell: pwsh
        run: |
          $cargoToml = Get-Content "apps/desktop/Cargo.toml" -Raw
          if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
            $version = $Matches[1]
            "APP_VERSION=$version" >> $env:GITHUB_ENV
            Write-Host "APP_VERSION=$version"
          } else {
            Write-Error "Could not find version in apps/desktop/Cargo.toml"
            exit 1
          }

      - name: Build installer with Inno Setup
        id: build_installer
        shell: pwsh
        run: |
          $issDir = "packaging/windows"
          $deployDir = (Resolve-Path "target/release/sujian-windows-${{ matrix.flavor }}").Path
          Write-Host "DeployDir: $deployDir"
          Write-Host "APP_VERSION: $env:APP_VERSION"
          # Inno Setup 安装后可能需要刷新 PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          ISCC /DAppVersion=$env:APP_VERSION /DFlavor=${{ matrix.flavor }} "/DDeployDir=$deployDir" "$issDir\sujian.iss"
          $outputDir = Join-Path $issDir "Output"
          if (Test-Path $outputDir) {
            $installer = Get-ChildItem "$outputDir\*.exe" | Select-Object -First 1
            if ($installer) {
              Move-Item $installer.FullName "target/release/" -Force
              Write-Host "Moved installer to target/release/$($installer.Name)"
            }
          }
          # Record actual installer path for subsequent steps
          $installer = Get-ChildItem "target/release/*${{ matrix.flavor }}*.exe" | Where-Object { $_.Name -notlike "sujian-windows-*" } | Select-Object -First 1
          if ($installer) {
            "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "Installer path: $($installer.FullName)"
          }

      - name: Sign installer (optional)
        shell: pwsh
        run: |
          if ($env:SIGNING_CERT_SECRET) {
            $certBytes = [System.Convert]::FromBase64String($env:SIGNING_CERT_SECRET)
            $certPath = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)
            $installerPath = "${{ steps.build_installer.outputs.installer_path }}"
            if ($installerPath -and (Test-Path $installerPath)) {
              $signArgs = @("sign", "/f", $certPath, "/tr", "http://timestamp.digicert.com", "/td", "sha256", "/fd", "sha256")
              if ($env:SIGNING_CERT_PASSWORD) {
                $signArgs += @("/p", $env:SIGNING_CERT_PASSWORD)
              }
              $signArgs += $installerPath
              & signtool @signArgs
              Write-Host "Installer signed successfully"
            } else {
              Write-Host "Installer not found at INSTALLER_PATH=$installerPath, skipping signing"
            }
            Remove-Item $certPath -Force
          } else {
            Write-Host "SIGNING_CERT_SECRET not set, skipping installer signing"
          }
        env:
          SIGNING_CERT_SECRET: ${{ secrets.SIGNING_CERT_SECRET }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: sujian-windows-${{ matrix.flavor }}-portable
          path: target/release/sujian-windows-${{ matrix.flavor }}-portable.zip
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sujian-windows-${{ matrix.flavor }}-installer
          path: ${{ steps.build_installer.outputs.installer_path }}
          retention-days: 30
